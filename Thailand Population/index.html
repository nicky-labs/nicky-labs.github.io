<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ภาพรวมประชากรไทย · Thailand Demographic Overview</title>
<meta name="description" content="Bilingual educational dashboard on Thailand's population structure and demographic change, built from official NSO, DOPA and MoPH tables.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Thailand Demographic Overview — ภาพรวมประชากรไทย
   Chart colours follow the validated data-viz palette; the page around them is
   deliberately quiet so the marks carry the meaning. */

:root {
  color-scheme: light;
  --surface-1: #fcfcfb;
  --page: #f4f4f1;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.09);
  --border-strong: rgba(11, 11, 11, 0.16);

  --male: #2a78d6;
  --female: #e34948;
  --births: #2a78d6;
  --deaths: #e34948;
  --age-child: #86b6ef;
  --age-work: #2a78d6;
  --age-older: #104281;
  --accent: #2a78d6;
  --accent-2: #e34948;
  --seq-1: #cde2fb;
  --seq-2: #9ec5f4;
  --seq-3: #5598e7;
  --seq-4: #2a78d6;
  --seq-5: #184f95;

  --good: #006300;
  --bad: #c3352f;
  --neutral: #52514e;
  --wash: rgba(42, 120, 214, 0.06);

  --r-lg: 16px;
  --r-md: 10px;
  --r-sm: 7px;
  --font: "Noto Sans Thai", "Noto Sans Thai Looped", "Sarabun", system-ui,
          -apple-system, "Segoe UI", "Leelawadee UI", "Tahoma", sans-serif;
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-1: #1a1a19;
  --page: #0d0d0d;
  --text-primary: #ffffff;
  --text-secondary: #c3c2b7;
  --text-muted: #898781;
  --grid: #2c2c2a;
  --axis: #383835;
  --border: rgba(255, 255, 255, 0.10);
  --border-strong: rgba(255, 255, 255, 0.20);

  --male: #3987e5;
  --female: #e66767;
  --births: #3987e5;
  --deaths: #e66767;
  --age-child: #9ec5f4;
  --age-work: #3987e5;
  --age-older: #184f95;
  --accent: #3987e5;
  --accent-2: #e66767;
  --seq-1: #184f95;
  --seq-2: #256abf;
  --seq-3: #3987e5;
  --seq-4: #6da7ec;
  --seq-5: #b7d3f6;

  --good: #0ca30c;
  --bad: #e66767;
  --neutral: #c3c2b7;
  --wash: rgba(57, 135, 229, 0.10);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

body {
  margin: 0;
  font-family: var(--font);
  background: var(--page);
  color: var(--text-primary);
  font-size: 16px;
  line-height: 1.62;
  -webkit-font-smoothing: antialiased;
}

/* type scale ------------------------------------------------------------- */
h1, h2, h3, h4 { line-height: 1.28; margin: 0 0 .35em; font-weight: 700; letter-spacing: -0.011em; }
h1 { font-size: clamp(1.55rem, 2.4vw + .8rem, 2.2rem); }
h2 { font-size: 1.28rem; }
h3 { font-size: 1.02rem; }
h4 { font-size: .92rem; }
p { margin: 0 0 1em; }
a { color: var(--accent); text-underline-offset: 2px; }

.wrap { max-width: 1140px; margin: 0 auto; padding: 0 22px; }
.muted { color: var(--text-muted); }

.skip {
  position: absolute; left: -9999px; top: 0; background: var(--accent);
  color: #fff; padding: 10px 16px; z-index: 100; border-radius: 0 0 8px 0;
}
.skip:focus { left: 0; }

/* header ------------------------------------------------------------------ */
.site-header {
  position: sticky; top: 0; z-index: 60;
  background: color-mix(in srgb, var(--page) 88%, transparent);
  backdrop-filter: saturate(140%) blur(10px);
  border-bottom: 1px solid var(--border);
}
.header-inner {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 9px 22px; max-width: 1140px; margin: 0 auto;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark {
  width: 26px; height: 26px; border-radius: 7px; flex: none;
  background: linear-gradient(155deg, var(--accent) 0 48%, var(--accent-2) 48% 100%);
}
.brand-name { font-size: .92rem; font-weight: 700; margin: 0; white-space: nowrap; }

.header-tools { display: flex; align-items: center; gap: 6px; margin-left: auto; }
@media (max-width: 520px) { .header-tools { margin-left: 0; } }

.seg {
  display: inline-flex; border: 1px solid var(--border-strong);
  border-radius: 999px; overflow: hidden; background: var(--surface-1);
}
.seg button {
  font: inherit; font-size: .78rem; padding: 4px 11px; border: 0;
  background: transparent; color: var(--text-secondary); cursor: pointer; white-space: nowrap;
}
.seg.small button { font-size: .73rem; padding: 3px 9px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 600; }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

.icon-btn {
  font: inherit; font-size: .8rem; width: 30px; height: 28px; cursor: pointer;
  border: 1px solid var(--border-strong); border-radius: 999px;
  background: var(--surface-1); color: var(--text-secondary); line-height: 1;
}
.icon-btn:hover { border-color: var(--accent); color: var(--accent); }

.quiet-btn {
  font: inherit; font-size: .76rem; padding: 4px 10px; cursor: pointer;
  border: 1px solid transparent; border-radius: 999px; text-decoration: none;
  background: transparent; color: var(--text-secondary); white-space: nowrap;
}
.quiet-btn:hover { background: var(--wash); color: var(--accent); }
.quiet-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.toggle {
  display: inline-flex; gap: 6px; align-items: center; cursor: pointer;
  font-size: .76rem; color: var(--text-secondary); white-space: nowrap;
}
.toggle input { accent-color: var(--accent); margin: 0; }

/* lede -------------------------------------------------------------------- */
.lede { padding: 46px 0 8px; max-width: 74ch; }
.badge {
  display: inline-block; font-size: .7rem; padding: 3px 10px; border-radius: 999px;
  background: var(--wash); color: var(--accent); margin-bottom: 14px; font-weight: 600;
}
.lede h1 { max-width: 20ch; }
.lede-text { color: var(--text-secondary); font-size: 1.02rem; }

/* generic blocks ---------------------------------------------------------- */
.block, .stage {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: 24px; margin: 0 0 20px;
}
.block-head, .stage-head { margin-bottom: 16px; }
.block-sub, .stage-sub, .fig-sub { color: var(--text-secondary); font-size: .85rem; margin: 0; }

section[id] { scroll-margin-top: 74px; }

/* stage ------------------------------------------------------------------- */
.stage { padding: 26px 24px 8px; }
.stage-head { display: flex; gap: 14px; align-items: flex-start; }
.stage-num {
  flex: none; width: 30px; height: 30px; border-radius: 50%;
  display: grid; place-items: center; font-size: .82rem; font-weight: 700;
  background: var(--accent); color: #fff; margin-top: 2px;
}
.stage-head h2 { margin-bottom: 2px; }

/* figure ------------------------------------------------------------------ */
.fig { padding: 22px 0; border-top: 1px solid var(--border); }
.stage > .fig:first-of-type { border-top: 0; padding-top: 4px; }
.fig-head {
  display: flex; gap: 14px; align-items: flex-start;
  flex-wrap: wrap; margin-bottom: 12px;
}
.fig-titles { margin-right: auto; min-width: 0; }
.fig-titles h3 { margin-bottom: 1px; }
.fig-year { color: var(--text-secondary); font-weight: 400; font-size: .9rem; }
.fig-tools { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.fig-desc { font-size: .85rem; color: var(--text-secondary); margin: 12px 0 0; max-width: 88ch; }
.sub-head { margin: 20px 0 10px; }

.fig-source {
  margin: 14px 0 0; font-size: .71rem; color: var(--text-muted); line-height: 1.55;
}
.fig-source b { color: var(--text-secondary); font-weight: 600; }
.fig-source a { color: var(--text-secondary); }
.fig-source .chip {
  display: inline-block; padding: 0 7px; border-radius: 999px; font-size: .67rem;
  border: 1px solid var(--border-strong); margin-left: 5px;
}

/* filters — each control sits in the figure it steers ---------------------- */
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: .73rem; font-weight: 600; color: var(--text-secondary); }
select {
  font: inherit; font-size: .85rem; padding: 7px 9px; border-radius: var(--r-sm);
  border: 1px solid var(--border-strong); background: var(--surface-1);
  color: var(--text-primary); max-width: 100%;
}
select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* a filter control living inside a figure */
.ff { display: flex; flex-direction: column; gap: 3px; min-width: 132px; }
.ff > span { font-size: .7rem; font-weight: 600; color: var(--text-secondary); }
.ff select { width: 100%; }
.fig-tools .ff { min-width: 118px; }
.fig-filters {
  display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end;
  margin: 0 0 14px; padding: 11px 13px;
  background: var(--wash); border: 1px solid var(--border); border-radius: var(--r-sm);
}
.fig-filters .ff { flex: 1 1 150px; }
.fig-filters .ff.wide { flex: 2 1 250px; }
.filter-hint { font-size: .72rem; color: var(--text-muted); margin: 8px 0 14px; }
.range-row { display: flex; align-items: center; gap: 6px; }
.range-row select { flex: 1; min-width: 0; }
.range-dash { color: var(--text-muted); }

.segment-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 0 0 4px; }
.segment-row .seg-label { font-size: .73rem; font-weight: 600; color: var(--text-secondary); }
.segment-row button {
  font: inherit; font-size: .74rem; padding: 3px 11px; cursor: pointer;
  border: 1px solid var(--border-strong); border-radius: 999px;
  background: var(--surface-1); color: var(--text-secondary);
}
.segment-row button:hover { border-color: var(--accent); color: var(--accent); }
.segment-row button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

/* map --------------------------------------------------------------------- */
.map-grid { display: grid; gap: 24px; grid-template-columns: 1fr; align-items: start; }
@media (min-width: 880px) { .map-grid { grid-template-columns: minmax(260px, .8fr) 1.2fr; } }
.map-pane, .rank-pane { min-width: 0; }
.rank-pane { display: flex; flex-direction: column; gap: 22px; }
.rank-pane h4 { margin-bottom: 8px; }
.fig-head.compact { margin-bottom: 8px; }
.region-pane h4 { margin-bottom: 8px; }
.scale-legend { display: flex; align-items: center; gap: 0; margin: 0 0 8px; font-size: .73rem; color: var(--text-secondary); }
.scale-legend .sw { width: 26px; height: 11px; }
.scale-legend .sw:first-of-type { border-radius: 3px 0 0 3px; }
.scale-legend .sw:last-of-type { border-radius: 0 3px 3px 0; }
.scale-legend .lo { margin-right: 7px; }
.scale-legend .hi { margin-left: 7px; }

/* what is currently narrowing the view — only present when something is ---- */
.active-strip:empty { display: none; }
.active-strip {
  display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
  position: sticky; top: 62px; z-index: 30;
  margin: 0 0 20px; padding: 9px 14px;
  background: var(--surface-1); border: 1px solid var(--accent);
  border-radius: var(--r-sm); box-shadow: 0 4px 16px rgba(11, 11, 11, .10);
}
.active-strip .af-label { font-size: .73rem; font-weight: 600; color: var(--text-secondary); }
.active-strip .af {
  font-size: .73rem; padding: 2px 9px; border-radius: 999px;
  border: 1px solid var(--accent); color: var(--accent); background: var(--wash);
}
.active-strip .af b { font-weight: 600; color: var(--text-secondary); }

/* multi-select ------------------------------------------------------------ */
.ms { position: relative; }
.ms-btn {
  font: inherit; font-size: .85rem; padding: 7px 9px; width: 100%;
  border: 1px solid var(--border-strong); border-radius: var(--r-sm);
  background: var(--surface-1); color: var(--text-primary); cursor: pointer;
  display: flex; align-items: center; gap: 8px; text-align: left; min-height: 35px;
}
.ms.has-sel .ms-btn { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.ms-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.ms-summary { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ms-caret { flex: none; width: 0; height: 0; border: 5px solid transparent; border-top-color: var(--text-muted); margin-top: 4px; }
.ms[data-open="true"] .ms-caret { border-top-color: transparent; border-bottom-color: var(--accent); margin-top: -4px; }
.ms-panel {
  position: absolute; z-index: 55; top: calc(100% + 4px); left: 0; min-width: 100%;
  max-width: min(320px, 82vw);
  background: var(--surface-1); border: 1px solid var(--border-strong);
  border-radius: var(--r-md); padding: 8px;
  box-shadow: 0 8px 28px rgba(11, 11, 11, .12);
}
.ms-search {
  font: inherit; font-size: .8rem; width: 100%; padding: 6px 8px; margin-bottom: 6px;
  border: 1px solid var(--border-strong); border-radius: 6px;
  background: var(--surface-1); color: var(--text-primary);
}
.ms-actions { display: flex; gap: 6px; margin-bottom: 6px; }
.ms-actions button {
  font: inherit; font-size: .71rem; padding: 3px 9px; cursor: pointer; flex: 1;
  border: 1px solid var(--border-strong); border-radius: 999px;
  background: transparent; color: var(--text-secondary);
}
.ms-actions button:hover { border-color: var(--accent); color: var(--accent); }
.ms-list { max-height: 236px; overflow-y: auto; }
.ms-group {
  font-size: .66rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
  color: var(--text-muted); margin: 8px 0 3px; padding: 0 2px;
}
.ms-row {
  display: flex; gap: 8px; align-items: flex-start; padding: 4px;
  font-size: .81rem; border-radius: 5px; cursor: pointer; line-height: 1.45;
}
.ms-row:hover { background: var(--wash); }
.ms-row.is-disabled { color: var(--text-muted); cursor: not-allowed; }
.ms-row input { margin: 3px 0 0; accent-color: var(--accent); flex: none; }
.ms-empty { font-size: .8rem; color: var(--text-muted); margin: 6px 4px; }

/* key numbers ------------------------------------------------------------- */
.card-grid { display: grid; gap: 1px; background: var(--border); border-radius: var(--r-md); overflow: hidden; }
@media (min-width: 720px) {
  .card-grid { grid-template-columns: repeat(4, 1fr); }
  .card.hero { grid-column: span 2; }
}
@media (min-width: 1000px) {
  .card-grid { grid-template-columns: 1.35fr repeat(4, 1fr); }
  .card.hero { grid-column: auto; }
}
.card { background: var(--surface-1); padding: 16px 16px 15px; min-width: 0; }
.card-label {
  font-size: .75rem; color: var(--text-secondary); font-weight: 600;
  display: flex; gap: 5px; align-items: flex-start; line-height: 1.35;
}
@media (min-width: 720px) { .card-label { min-height: 2.7em; } }
.card-value {
  font-size: clamp(1.02rem, .62vw + .78rem, 1.3rem); font-weight: 700;
  letter-spacing: -0.022em; margin: 5px 0 3px;
  white-space: nowrap; word-break: keep-all; line-break: strict;
}
.card.hero { background: var(--wash); }
.card.hero .card-value { font-size: clamp(1.28rem, 1.15vw + .8rem, 1.85rem); }
.card-share { font-size: .76rem; color: var(--text-secondary); }
.card-deltas { margin-top: 9px; display: flex; flex-direction: column; gap: 2px; font-size: .72rem; }
.delta { display: flex; gap: 5px; align-items: baseline; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.delta .arrow { font-weight: 700; font-size: .66rem; }
.delta.up .arrow, .delta.up .amt { color: var(--good); }
.delta.down .arrow, .delta.down .amt { color: var(--bad); }
.delta.flat .arrow, .delta.flat .amt { color: var(--neutral); }
.delta .ctx { color: var(--text-muted); }
.card-tip { font-size: .72rem; color: var(--text-muted); margin-top: 9px; line-height: 1.5; }
.card.unavailable .card-value { color: var(--text-muted); font-size: .95rem; font-weight: 600; white-space: normal; }

.info {
  display: inline-flex; align-items: center; justify-content: center;
  width: 14px; height: 14px; border-radius: 50%; font-size: .58rem;
  border: 1px solid var(--border-strong); color: var(--text-muted);
  cursor: help; flex: none; font-weight: 700; align-self: center;
}

/* takeaways --------------------------------------------------------------- */
.takeaway-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(232px, 1fr)); }
.takeaway { border-left: 2px solid var(--accent); padding: 2px 0 2px 13px; }
.takeaway h3 { font-size: .93rem; margin-bottom: 4px; }
.takeaway p { font-size: .83rem; color: var(--text-secondary); margin: 0; }
.takeaway .num { font-size: .66rem; font-weight: 700; color: var(--accent); display: block; margin-bottom: 2px; }

/* charts ------------------------------------------------------------------ */
.legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 0 0 8px; font-size: .78rem; color: var(--text-secondary); }
.legend .item { display: inline-flex; align-items: center; gap: 6px; }
.legend .swatch { width: 11px; height: 11px; border-radius: 3px; flex: none; }
.legend .swatch.line { height: 3px; border-radius: 2px; width: 15px; }
.legend .swatch.dashed { background: repeating-linear-gradient(90deg, currentColor 0 5px, transparent 5px 9px); height: 3px; width: 17px; border-radius: 0; }

.chart-box { position: relative; width: 100%; }
.chart-box svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart-box:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

.axis-line { stroke: var(--axis); stroke-width: 1; }
.grid-line { stroke: var(--grid); stroke-width: 1; }
.tick-text { fill: var(--text-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.series-label { font-size: 12px; font-weight: 600; }
.marker-text { fill: var(--text-secondary); font-size: 11px; }
.marker-line { stroke: var(--text-muted); stroke-width: 1; stroke-dasharray: 3 3; }

.tooltip {
  position: absolute; pointer-events: none; z-index: 20;
  background: var(--surface-1); border: 1px solid var(--border-strong);
  border-radius: 9px; padding: 9px 11px; box-shadow: 0 6px 22px rgba(11, 11, 11, .13);
  font-size: .79rem; min-width: 128px; opacity: 0; transition: opacity .1s;
}
.tooltip.on { opacity: 1; }
.tooltip .tt-title { font-weight: 700; margin-bottom: 5px; font-size: .81rem; }
.tooltip .tt-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.tooltip .tt-row .k { display: inline-flex; gap: 6px; align-items: center; color: var(--text-secondary); }
.tooltip .tt-row .v { font-variant-numeric: tabular-nums; font-weight: 600; }
.tooltip .dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
.tooltip .tt-note { margin-top: 6px; color: var(--text-muted); font-size: .71rem; max-width: 30ch; }

/* disclosure -------------------------------------------------------------- */
details.howto { margin-top: 12px; }
details.howto summary {
  cursor: pointer; font-size: .78rem; font-weight: 600; color: var(--accent);
  list-style: none; display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 0;
}
details.howto summary::-webkit-details-marker { display: none; }
details.howto summary::before {
  content: ""; width: 0; height: 0; border: 4px solid transparent;
  border-left-color: currentColor; transition: transform .15s;
}
details.howto[open] summary::before { transform: rotate(90deg) translateX(-1px); }
details.howto > p, details.howto > ul {
  font-size: .82rem; color: var(--text-secondary); margin: 6px 0 0; max-width: 92ch;
}

/* tables ------------------------------------------------------------------ */
.fig-table { max-height: 330px; overflow: auto; margin-top: 12px; border: 1px solid var(--border); border-radius: var(--r-sm); }
table.data { border-collapse: collapse; width: 100%; font-size: .79rem; }
table.data th, table.data td { padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
table.data th:first-child, table.data td:first-child { text-align: left; }
table.data thead th { position: sticky; top: 0; background: var(--surface-1); font-weight: 600; color: var(--text-secondary); }
table.data td { font-variant-numeric: tabular-nums; }
table.data tbody tr:last-child td { border-bottom: 0; }

/* composition / comparison ------------------------------------------------ */
.composition-grid { display: grid; gap: 26px; grid-template-columns: 1fr; align-items: start; }
@media (min-width: 880px) { .composition-grid { grid-template-columns: minmax(230px, .8fr) 2fr; } }
.sub-fig { min-width: 0; }

.compare-grid { display: grid; gap: 20px; grid-template-columns: 1fr; align-items: start; }
@media (min-width: 860px) { .compare-grid { grid-template-columns: 1.2fr 1fr; } }
.compare-summary {
  border-left: 2px solid var(--accent); padding: 2px 0 2px 14px; font-size: .85rem;
}
.compare-summary h4 { font-size: .9rem; }
.compare-summary p { color: var(--text-secondary); margin: 0; }
.warn-note {
  margin-top: 10px; font-size: .78rem; color: var(--text-primary);
  border-left: 2px solid #ec835a; padding: 7px 12px;
  background: color-mix(in srgb, #ec835a 10%, transparent); border-radius: 0 6px 6px 0;
}

/* insights ---------------------------------------------------------------- */

,"insight.retirement.imp":"ความสนใจอาจเพิ่มขึ้นในผลิตภัณฑ์บำนาญ กองทุนเพื่อการเกษียณ ประกันสุขภาพ และการวางแผนมรดก อายุขัยที่ยาวขึ้นยังหมายความว่าเงินออมต้องใช้ได้นานขึ้นด้วย","insight.housing.title":"ที่อยู่อาศัยและการก่อตั้งครัวเรือน","insight.housing.obs":"ประชากรรวมแทบไม่เปลี่ยน แต่กลุ่มอายุ 25–39 ปี ซึ่งเป็นวัยตั้งครัวเรือน มีจำนวน {youngAdults} ในปี {lastYear}","insight.housing.why":"ความต้องการที่อยู่อาศัยขึ้นกับจำนวนครัวเรือน ไม่ใช่จำนวนคนเพียงอย่างเดียว ครอบครัวที่เล็กลงและครัวเรือนคนเดียวหรือผู้สูงอายุอาจทำให้จำนวนครัวเรือนเพิ่มขึ้นแม้ประชากรไม่เพิ่ม","insight.housing.imp":"ความต้องการอาจเอียงไปทางที่อยู่อาศัยขนาดเล็ก บ้านชั้นเดียวหรือไร้ขั้นบันได และทำเลใกล้บริการสุขภาพ ทั้งนี้ข้อมูลขนาดครัวเรือนเผยแพร่แยกต่างหากและไม่ได้แสดงที่นี่","insight.regional.title":"ขนาดตลาดรายภูมิภาค","insight.regional.obs":"ภาคตะวันออกเฉียงเหนือมีประชากรตามทะเบียน {neShare} ({nePop}) ส่วนกรุงเทพฯ และปริมณฑลมี {bkkShare} ({bkkPop})","insight.regional.why":"จำนวนประชากรเป็นตัววัดขนาดตลาดที่หยาบที่สุดแต่เสถียรที่สุด กำลังซื้อแตกต่างกันตามภาคและไม่ได้แสดงไว้ที่นี่","insight.regional.imp":"เครือข่ายกระจายสินค้าหรือสาขาที่วางแผนจากจำนวนประชากรอย่างเดียว จะหน้าตาต่างจากที่วางแผนจากรายได้มาก โดยทั่วไปจึงต้องดูทั้งสองมุม","insight.segments.title":"กลุ่มผู้บริโภค","insight.segments.obs":"ในปี {lastYear} ประชากรแบ่งคร่าว ๆ เป็นเด็ก {childShare} วัยแรงงาน {workShare} และอายุ 60 ปีขึ้นไป {olderShare}","insight.segments.why":"กลุ่มที่เคยถูกมองว่าเป็นตลาดเฉพาะ วันนี้ใหญ่แล้ว ลำพังกลุ่ม 60 ปีขึ้นไปยังมากกว่าประชากรอายุ 0–19 ปีทั้งหมด","insight.segments.imp":"สินค้าที่ออกแบบสำหรับตลาดมวลชนวัยหนุ่มสาวอาจกำลังจับกลุ่มที่สัดส่วนเล็กลง ซึ่งอาจเป็นเหตุผลให้ทบทวนว่าใครคือลูกค้าตั้งต้น","insight.older.title":"สินค้าและบริการสำหรับผู้บริโภคสูงวัย","insight.older.obs":"มีผู้มีอายุ 60 ปีขึ้นไป {olderPop} คนในปี {lastYear} โดยกลุ่ม 70 ปีขึ้นไปเติบโตเร็วที่สุด","insight.older.why":"ผู้บริโภคสูงวัยไม่ใช่กลุ่มเดียวกัน คนอายุ 62 ปีที่ยังทำงานกับคนอายุ 85 ปีที่ต้องการการดูแลรายวันแทบไม่มีอะไรเหมือนกัน","insight.older.imp":"โอกาสอาจรวมถึงการออกแบบที่เข้าถึงง่าย สุขภาพและโภชนาการ การท่องเที่ยวนอกฤดู เทคโนโลยีที่ใช้ง่าย และบริการที่ลดภาระทางกาย ทั้งนี้ข้อมูลความสามารถในการจ่ายไม่ได้อยู่ในชุดข้อมูลนี้","insight.younger.title":"สินค้าและบริการสำหรับผู้บริโภควัยเยาว์","insight.younger.obs":"กลุ่มอายุ 0–14 ปีลดเหลือ {childPop} ในปี {lastYear} คิดเป็น {childShare} ของประชากร","insight.younger.why":"เด็กน้อยลงอาจหมายถึงตลาดเชิงปริมาณเล็กลง แต่ไม่จำเป็นต้องเล็กลงในเชิงมูลค่า เพราะการใช้จ่ายต่อเด็กหนึ่งคนอาจสูงขึ้นเมื่อครอบครัวเล็กลง","insight.younger.imp":"สินค้าสำหรับเด็กอาจแข่งขันด้วยคุณภาพและตำแหน่งพรีเมียมมากกว่าปริมาณ ทั้งนี้เป็นรูปแบบที่พบในที่อื่น ไม่ใช่สิ่งที่ตารางเหล่านี้พิสูจน์","insight.bangkok.title":"กรุงเทพฯ เมืองใหญ่ และจังหวัดอื่น","insight.bangkok.obs":"กรุงเทพมหานครมีประชากรตามทะเบียน {bkkPopOnly} อัตราส่วนเพศ {bkkSexRatio} และความหนาแน่น {bkkDensity} เทียบกับความหนาแน่นทั้งประเทศ {natDensity}","insight.bangkok.why":"ประชากรตามทะเบียนนับตามที่อยู่ที่จดทะเบียน ไม่ใช่ที่อยู่จริง คนวัยทำงานที่ย้ายเข้ากรุงเทพฯ หรือจังหวัดอุตสาหกรรมภาคตะวันออกมักไม่ได้ย้ายทะเบียนตาม","insight.bangkok.imp":"ตลาดจริงของกรุงเทพฯ ในเวลากลางวันน่าจะใหญ่กว่าตัวเลขทะเบียน ขณะที่บางจังหวัดชนบทน่าจะมีคนน้อยกว่าและสูงวัยกว่าที่ทะเบียนระบุ จึงควรถือว่าตัวเลขรายจังหวัดเป็นขั้นต่ำสำหรับเมืองใหญ่ และเป็นขั้นสูงสำหรับจังหวัดต้นทาง","glossary.heading":"อภิธานศัพท์","glossary.sub":"คำอธิบายสั้น ๆ ของคำที่ใช้ในหน้านี้","glossary.growth.term":"อัตราการเติบโตของประชากร","glossary.growth.def":"ร้อยละการเปลี่ยนแปลงของประชากรจากปีหนึ่งไปอีกปีหนึ่ง ค่าติดลบหมายถึงประชากรลดลง","glossary.sexRatio.term":"อัตราส่วนเพศ","glossary.sexRatio.def":"จำนวนชายต่อหญิง 100 คน ค่า 95 หมายถึงมีชาย 95 คนต่อหญิง 100 คน","glossary.dependency.term":"อัตราพึ่งพิง","glossary.dependency.def":"จำนวนผู้มีอายุ 0–14 ปีรวมกับผู้มีอายุ 60 ปีขึ้นไป ต่อผู้มีอายุ 15–59 ปี 100 คน ใช้วัดคร่าว ๆ ว่าวัยแรงงานหนึ่งคนต้องดูแลผู้ไม่ได้ทำงานกี่คน","glossary.registered.term":"ประชากรตามทะเบียนราษฎร","glossary.registered.def":"ผู้มีชื่ออยู่ในระบบทะเบียนราษฎรของกรมการปกครอง เป็นการนับตามที่อยู่ที่จดทะเบียน ซึ่งอาจไม่ใช่ที่อยู่จริง","glossary.census.term":"สำมะโนประชากร","glossary.census.def":"การนับผู้อยู่อาศัยทุกคนในประเทศ ณ วันที่กำหนด ดำเนินการโดยสำนักงานสถิติแห่งชาติราวทุก 10 ปี เป็นการนับตามที่อยู่จริง","glossary.survey.term":"ข้อมูลจากการสำรวจ","glossary.survey.def":"ตัวเลขที่ได้จากการสอบถามครัวเรือนตัวอย่างแล้วขยายผลไปทั้งประเทศ จึงมีค่าความคลาดเคลื่อน","glossary.projection.term":"ประมาณการประชากร","glossary.projection.def":"การคำนวณว่าประชากรในอนาคตจะเป็นเท่าใด ภายใต้สมมติฐานอัตราเกิด ตาย และย้ายถิ่น เป็นภาพฉาย ไม่ใช่การวัดจริง","glossary.aged.term":"สังคมสูงอายุอย่างสมบูรณ์","glossary.aged.def":"คำที่ใช้เรียกประเทศที่มีผู้อายุ 60 ปีขึ้นไปเกินร้อยละ 20 ของประชากร","glossary.naturalChange.term":"การเปลี่ยนแปลงตามธรรมชาติ","glossary.naturalChange.def":"จำนวนการเกิดลบด้วยจำนวนการตายในหนึ่งปี โดยไม่นับการย้ายถิ่น ค่าติดลบหมายถึงคนตายมากกว่าคนเกิด","questions.heading":"คำถามชวนคุยในห้องเรียน","questions.sub":"ลองใช้ตัวกรองด้านบนหาหลักฐานก่อนตอบ","questions.1":"โครงสร้างอายุของไทยเปลี่ยนไปอย่างไรในช่วงปีที่แสดง ถ้าต้องเลือกปีเดียวมาอธิบายการเปลี่ยนแปลงนี้ จะเลือกปีไหน เพราะอะไร","questions.2":"สังคมสูงอายุอาจส่งผลอะไรต่อตลาดแรงงาน ลองบอกผลที่คาดว่าจะเกิดหนึ่งข้อ และผลที่คิดว่าจะไม่เกิดหนึ่งข้อ","questions.3":"ตลาดผู้บริโภคใดน่าจะโต และตลาดใดน่าจะหด ต้องใช้ข้อมูลเพิ่มอะไรก่อนให้คำแนะนำกับบริษัทจริง","questions.4":"ทำไมประชากรตามทะเบียนของจังหวัดหนึ่งจึงอาจต่างจากจำนวนคนที่อาศัยอยู่จริง คิดว่าจังหวัดใดน่าจะมีส่วนต่างมากที่สุด","questions.5":"การตายแซงการเกิดในปี {crossYear} ลองเสนอคำอธิบายอย่างน้อยสองแบบ และบอกว่าจะแยกแยะสองคำอธิบายนี้ได้อย่างไร","questions.6":"ตัวเลขปี 2547 (2004) ลดลงอย่างฮวบฮาบ ก่อนจะสรุปว่าประชากรลดลงจริง ควรตรวจสอบอะไรก่อน","sources.below":"แหล่งข้อมูล","sources.org":"หน่วยงาน","sources.table":"ตาราง","sources.dataYear":"ปีข้อมูล","sources.updated":"ปรับปรุงล่าสุด","sources.link":"เปิดแหล่งข้อมูลทางการ","sources.classification":"ประเภทข้อมูล","sources.registeredNote":"ข้อมูลประชากรจากกรมการปกครองเป็นข้อมูลประชากรตามทะเบียนราษฎร ซึ่งอาจแตกต่างจากจำนวนประชากรที่อาศัยอยู่จริงในพื้นที่","methodology.title":"ระเบียบวิธี ข้อจำกัด และแหล่งข้อมูล","methodology.intro":"หน้านี้อธิบายว่าตัวเลขทุกตัวในแดชบอร์ดมาจากที่ใด จัดกลุ่มอย่างไร และข้อมูลนี้บอกอะไรไม่ได้บ้าง","methodology.h.sources":"แหล่งข้อมูลที่ใช้","methodology.h.how":"วิธีประกอบข้อมูล","methodology.h.types":"ประเภทของข้อมูล และเหตุผลที่ต้องไม่นำมาปนกัน","methodology.h.limits":"ข้อจำกัด","methodology.h.schema":"ไฟล์ข้อมูลและโครงสร้าง","methodology.how.body":"ตัวเลขคัดลอกจากตารางที่เผยแพร่ในสมุดสถิติรายปีประเทศไทย (ฉบับ พ.ศ. 2562 และ พ.ศ. 2564–2568) ซึ่งนำเสนอข้อมูลทะเบียนราษฎรของกรมการปกครอง และทะเบียนการเกิด-การตายของกระทรวงสาธารณสุข ไม่มีการดึงข้อมูลจากเว็บไซต์ขณะใช้งาน และไม่มีการเติมค่าใด ๆ ในกรณีที่ตารางแยกกลุ่ม 95–99 ปี กับ 100 ปีขึ้นไป ได้นำสองกลุ่มมารวมเป็น 95 ปีขึ้นไป ซึ่งเป็นการบวกตรง ๆ ไม่ใช่การประมาณ กลุ่มอายุหลักสร้างจากการรวมกลุ่มอายุ 5 ปีที่เผยแพร่ ได้แก่ เด็ก 0–14 ปี วัยแรงงาน 15–59 ปี และผู้สูงอายุ 60 ปีขึ้นไป ตารางต้นทางมีแถว “ไม่ทราบอายุ” จำนวนไม่ถึง 100 คนต่อปี ซึ่งไม่รวมในปิรามิดแต่รวมอยู่ในยอดรวมที่เผยแพร่ ปิรามิดจึงรวมกันได้น้อยกว่ายอดรวมเล็กน้อย","methodology.types.body":"ประชากรตามทะเบียนราษฎร สำมะโนประชากร ข้อมูลสำรวจ และประมาณการ เป็นสี่สิ่งที่วัดด้วยวิธีต่างกัน แดชบอร์ดนี้แยกทั้งสี่ออกจากกัน อนุกรมเวลาหลักใช้ข้อมูลทะเบียนราษฎรเท่านั้น ข้อมูลสำมะโนแสดงแยกต่างหาก ส่วนประมาณการวาดด้วยเส้นประและแรเงาต่างออกไป และไม่เคยต่อเข้ากับข้อมูลจริงราวกับเป็นการวัดชนิดเดียวกัน","methodology.limits.1":"ประชากรตามทะเบียนนับตามที่อยู่ที่จดทะเบียน ไม่ใช่ที่อยู่จริง จังหวัดปลายทางของแรงงานจึงถูกนับต่ำกว่าจริง ส่วนจังหวัดต้นทางถูกนับสูงกว่าจริง","methodology.limits.2":"ตารางที่ใช้ไม่ได้เผยแพร่โครงสร้างอายุรายจังหวัด มุมมองรายจังหวัดจึงแสดงเฉพาะยอดรวม อัตราส่วนเพศ และความหนาแน่น","methodology.limits.3":"ข้อมูลการเกิดและการตายมาจากทะเบียนของกระทรวงสาธารณสุข ครอบคลุมปี 2556–2566 (2013–2023) ซึ่งใช้ฐานต่างจากทะเบียนของกรมการปกครอง จึงไม่ควรนำมาเทียบกันโดยตรง","methodology.limits.4":"อนุกรมทะเบียนรา akeaways.1.title":"The population has stopped growing","takeaways.1.body":"Registered population peaked at {peakPop} in {peakYear} and stood at {latestPop} in {latestYear}. Growth has been negative in five of the last six years.","takeaways.2.title":"Deaths now outnumber births","takeaways.2.body":"{crossYear} was the first year in this series where deaths ({crossDeaths}) exceeded births ({crossBirths}). In {vitalYear} the gap was {vitalGap}.","takeaways.3.title":"One in five people is 60 or older","takeaways.3.body":"The 60+ group reached {olderShare} of the population in {latestYear} — up from {olderShareFirst} in {firstAgeYear}. Thailand is already an aged society.","takeaways.4.title":"There are far fewer small children","takeaways.4.body":"Children aged 0–4 fell from {kids0First} in {firstAgeYear} to {kids0Last} in {latestYear}, a drop of {kids0Change}.","takeaways.5.title":"Population is concentrated, but unevenly","takeaways.5.body":"The Northeast holds {neShare} of registered residents, while Bangkok and its five neighbouring provinces hold {bkkShare} on far less land.","composition.heading":"Composition in the selected year","composition.sub":"Who the {year} population is made up of","chart.sex.title":"Male and female","chart.sex.sub":"Share of the population, {year}","chart.sex.centre":"Sex ratio","chart.sex.centreNote":"males per 100 females","chart.sex.desc":"In {year} there were {male} males ({malePct}) and {female} females ({femalePct}) — {ratio} males for every 100 females.","chart.ageBar.title":"Population by age group","chart.ageBar.sub":"Five-year age groups, {year}","chart.ageBar.bySex":"Split by sex","chart.ageBar.desc":"The largest five-year age group in {year} is {top} with {topPop}; the smallest is {bottom} with {bottomPop}.","chart.ageBar.howToRead":"How to read this chart","chart.ageBar.howToReadBody":"Each bar is one five-year age group, from the youngest on the left to the oldest on the right. Tall bars in the middle and short bars on the left mean a large working-age generation with far fewer children coming up behind it. Choosing a single age group in the filters above highlights that bar.","chart.ageBar.selected":"Selected: {group}","chart.pyramid.title":"Population pyramid","chart.pyramid.sub":"Five-year age groups by sex","chart.pyramid.howToRead":"How to read this chart","chart.pyramid.howToReadBody":"Each bar is one five-year age group. Men are on the left, women on the right, and the youngest group sits at the bottom. A pyramid with a wide base means many children; a narrow base with a bulge in the middle — Thailand's shape today — means a large working-age generation followed by far fewer children behind it.","chart.pyramid.compare":"Compare with another year","chart.pyramid.compareOutline":"{year} shown as an outline","chart.pyramid.desc":"Population pyramid for {year}. The largest age groups are {top}. The 60-and-over group makes up {olderShare} of the population.","chart.pyramid.axis":"Population","chart.total.title":"Population over time","chart.total.sub":"{type} · {range}","chart.total.desc":"Population rose from {first} in {firstYear} to a peak of {peak} in {peakYear}, then fell to {last} in {lastYear}.","chart.total.showSex":"Show male and female separately","chart.total.marker.peak":"Peak population","chart.total.marker.dedup":"Registration clean-up","chart.total.marker.dedupTip":"The 2004 drop reflects the removal of duplicate records from the registration system, not people leaving the country.","chart.structure.title":"Age structure over time","chart.structure.sub":"Share of population by broad age group","chart.structure.howToRead":"How to read this chart","chart.structure.howToReadBody":"Each vertical slice is one year and always adds up to 100%. The thickness of a band shows that group's share of the population. Watch the top band (60+) get thicker and the bottom band (0–14) get thinner — that is population ageing.","chart.structure.desc":"Between {firstYear} and {lastYear} the share aged 60 and over rose from {olderFirst} to {olderLast}, while the share aged 0–14 fell from {childFirst} to {childLast}.","chart.structure.mode100":"Show as percentage","chart.structure.modeAbs":"Show as people","chart.vital.title":"Births and deaths","chart.vital.sub":"Registered live births and deaths, {range}","chart.vital.desc":"Births fell from {firstBirths} in {firstYear} to {lastBirths} in {lastYear}. Deaths rose over the same period, and first exceeded births in {crossYear}.","chart.vital.crossover":"Deaths pass births","chart.vital.births":"Births","chart.vital.deaths":"Deaths","chart.vital.natural":"Natural change","chart.province.title":"Provinces ranked","chart.province.sub":"Registered population, {year}","chart.province.desc":"{count} provinces shown, ranked by {measure}. Highest: {top} with {topPop}. Lowest shown: {bottom} with {bottomPop}.","chart.province.sortBy":"Sort by","chart.province.sortPop":"Population","chart.province.sortSexRatio":"Sex ratio","chart.province.sortDensity":"Density","chart.province.showTop":"Show","chart.province.top10":"Top 10","chart.province.top20":"Top 20","chart.province.allProv":"All 77","chart.province.tooltipPop":"Population","chart.province.tooltipSex":"Sex ratio","chart.province.tooltipDensity":"Density","chart.province.tooltipShare":"Share of Thailand","chart.province.densityUnit":"people/km²","chart.province.ageNote":"Age structure by province is not published in the tables used here, so it is not shown.","chart.compare.title":"Compare two years","chart.compare.sub":"{a} versus {b}","chart.compare.metric":"Measure","chart.compare.valueA":"{year}","chart.compare.valueB":"{year}","chart.compare.change":"Change","chart.compare.pctChange":"% change","chart.compare.summaryHeading":"What changed most","chart.compare.summary":"Between {a} and {b}, Thailand's registered population changed by {popChange} ({popPct}). The number of children aged 0–14 changed by {childChange}, the working-age group by {workChange}, and people aged 60 and over by {olderChange}. The dependency ratio moved from {depA} to {depB}.","chart.compare.mixedTypes":"These two years use different kinds of data ({typeA} and {typeB}). Compare them with care — the difference is partly a difference in method, not only in population.","insights.heading":"What the Data Tells Us","insights.sub":"Reading the numbers as an economist and a marketer would — carefully, and without claiming more than the data supports.","insights.observation":"Observation","insights.why":"Why it matters","insights.implication":"Possible implication","insights.caution":"These are interpretations, not forecasts. Demographic data describes what has happened to the population; it cannot on its own prove what caused a change or what will happen to a market. Read every implication below as one plausible reading among several.","insight.labour.title":"Labour-force size","insight.labour.obs":"The working-age population (15–59) was {workLast} in {lastYear}, down from {workFirst} in {firstYear}.","insight.labour.why":"This group produces most of the country's output and pays most of its income tax. When it shrinks while the total population stays flat, each worker carries more of the load.","insight.labour.imp":"Employers may face tighter competition for staff, particularly in sectors that rely on young workers. Wages, automation and migrant labour could all become more important parts of the discussion.","insight.growth.title":"Economic growth","insight.growth.obs":"Registered population growth was {growthLast}% in {lastYear}, and has been at or below zero in most recent years.","insight.growth.why":"Economies grow either because more people work or because each worker produces more. If the first source fades, the second has to do more of the work.","insight.growth.imp":"Productivity, skills and capital investment may matter more for future growth than they did when the workforce was still expanding. This is a possible reading, not a prediction.","insight.dependency.title":"Dependency burden","insight.dependency.obs":"The dependency ratio was {depLast} in {lastYear}, meaning about {depLast} children and older people for every 100 people of working age.","insight.dependency.why":"The composition matters as much as the level: this ratio is rising because of older people, not children, and older dependency tends to last longer and cost more per person.","insight.dependency.imp":"Pressure on pension, health and long-term care budgets could build gradually. Households may also spend more supporting elderly parents.","insight.health.title":"Healthcare demand","insight.health.obs":"People aged 60 and over reached {olderLast} of the population in {lastYear}, and those aged 80+ numbered {veryOld}.","insight.health.why":"Health spending per person rises steeply with age, and the oldest groups are growing fastest in percentage terms.","insight.health.imp":"Demand may grow for chronic-disease management, home care, rehabilitation, mobility aids and geriatric specialists — and for the workers to staff them.","insight.education.title":"Education demand","insight.education.obs":"Children aged 0–4 fell to {kids0Last} in {lastYear} from {kids0First} in {firstAgeYear}.","insight.education.why":"Today's 0–4 group is next decade's primary intake and the 2040s' university intake. School rolls follow births with a predictable lag.","insight.education.imp":"Some schools, especially in rural provinces, may face falling enrolment and consolidation, while demand could shift toward adult reskilling and lifelong learning.","insight.retirement.title":"Retirement and financial services","insight.retirement.obs":"The 55–59 group numbered {preRetire} in {lastYear} — the cohort closest to retirement.","insight.retirement.why":"A large group approaching retirement changes what households need from the financial system: less borrowing to build, more converting savings into income.","insight.retirement.imp":"Interest could grow in annuities, retirement funds, health insurance and inheritance planning. Longer lifespans may also mean savings must stretch further.","insight.housing.title":"Housing and household formation","insight.housing.obs":"The population is flat, but the 25–39 group — the usual age for forming a household — was {youngAdults} in {lastYear}.","insight.housing.why":"Housing demand follows the number of households, not just the number of people. Smaller families and more single or elderly households can keep household counts rising even when the population is not.","insight.housing.imp":"Demand may tilt toward smaller units, single-storey or step-free homes, and locations near healthcare. Household-size data is published separately and is not shown here.","insight.regional.title":"Regional market size","insight.regional.obs":"The Northeast holds {neShare} of registered residents ({nePop}); Bangkok and its vicinities hold {bkkShare} ({bkkPop}).","insight.regional.why":"Population is the crudest but most stable measure of a regional market's size. Spending power differs by region and is not shown here.","insight.regional.imp":"A distribution or store network planned on population alone would look very different from one planned on income. Both views are usually needed.","insight.segments.title":"Consumer segments","insight.segments.obs":"In {lastYear} the population split roughly {childShare} children, {workShare} working age and {olderShare} aged 60+.","insight.segments.why":"Segments that were once treated as a niche are now large. The 60+ group alone is bigger than the entire 0–19 population.","insight.segments.imp":"Products designed for a young mass market may be addressing a shrinking share of the population, which could suggest revisiting who the default customer is.","insight.older.title":"Products and services for older consumers","insight.older.obs":"There were {olderPop} people aged 60+ in {lastYear}, and the 70+ group grew fastest.","insight.older.why":"Older consumers are not one group — a 62-year-old still working and an 85-year-old needing daily support have little in common.","insight.older.imp":"Opportunities could include accessible design, health and nutrition, travel timed off-peak, simplified technology and services that reduce physical effort. Evidence on willingness to pay is not in this dataset.","insight.younger.title":"Products and services for younger consumers","insight.younger.obs":"The 0–14 group fell to {childPop} in {lastYear}, {childShare} of the population.","insight.younger.why":"Fewer children can mean a smaller volume market but not necessarily a smaller value market, since spending per child may rise when families are smaller.","insight.younger.imp":"Categories aimed at children may compete on quality and premium positioning rather than volume. This is a pattern seen elsewhere, not something these tables prove.","insight.bangkok.title":"Bangkok, big cities and everywhere else","insight.bangkok.obs":"Bangkok's registered population was {bkkPopOnly} with a sex ratio of {bkkSexRatio} and a density of {bkkDensity}, against a national density of {natDensity}.","insight.bangkok.why":"Registered population counts where people are registered, not where they sleep. Working-age people who move to Bangkok or the Eastern industrial provinces often keep their registration at home.","insight.bangkok.imp":"Bangkok's real daytime market is probably larger than its registered figure, and some rural provinces are probably older and smaller in practice than the register suggests. Treat provincial figures as a floor for cities and a ceiling for sending provinces.","glossary.heading":"Glossary","glossary.sub":"Short definitions for the terms used on this page","glossary.growth.term":"Population growth rate","glossary.growth.def":"The percentage change in population from one year to the next. A negative rate means the population fell.","glossary.sexRatio.term":"Sex ratio","glossary.sexRatio.def":"The number of males per 100 females. A value of 95 means 95 men for every 100 women.","glossary.dependency.term":"Dependency ratio","glossary.dependency.def":"The number of people aged 0–14 plus those aged 60 and over, for every 100 people aged 15–59. It is a rough measure of how many non-working people each working-age person supports.","glossary.registered.term":"Registered population","glossary.registered.def":"People recorded in the household registration system run by the Department of Provincial Administration. It counts where a person is registered, which may not be where they actually live.","glossary.census.term":"Census","glossary.census.def":"A count of everyone living in the country on a set date, carried out by the National Statistical Office roughly every ten years. It counts where people actually are.","glossary.survey.term":"Survey estimate","glossary.survey.def":"A figure produced by asking a sample of households and scaling the answers up to the whole population. It carries a margin of error.","glossary.projection.term":"Population projection","glossary.projection.def":"A calculation of what the population would be in future if assumed rates of birth, death and migration hold. It is a scenario, not a measurement.","glossary.aged.term":"Aged society","glossary.aged.def":"A commonly used label for a country where people aged 60 and over make up more than 20% of the population.","glossary.naturalChange.term":"Natural change","glossary.naturalChange.def":"Births minus deaths in a year, ignoring migration. A negative value means more people died than were born.","questions.heading":"Questions for class discussion","questions.sub":"Use the filters above to find evidence before you answer.","questions.1":"How has Thailand's age structure changed over the years shown? Which single year would you pick to illustrate the change, and why?","questions.2":"What could an ageing population mean for the labour market? Name one effect you would expect and one you would not.","questions.3":"Which consumer markets look likely to grow, and which look likely to shrink? What extra data would you need before advising a company?","questions.4":"Why might the registered population of a province differ from the number of people actually living there? Which provinces would you expect the gap to be largest in?","questions.5":"Deaths passed births in {crossYear}. What are at least two different explanations for this, and how would you tell them apart?","questions.6":"The 2004 figures show a sharp fall. Before concluding that the population dropped, what would you check?","sources.below":"Source","sources.org":"Organisation","sources.table":"Table","sources.dataYear":"Data year","sources.updated":"Last updated","sources.link":"Open the official source","sources.classification":"Data classification","sources.registeredNote":"Population data from the Department of Provincial Administration represents the registered population and may differ from the population currently residing in an area.","methodology.title":"Methodology, limitations and sources","methodology.intro":"This page explains exactly where every figure on the dashboard comes from, how the categories were built, and what the data cannot tell you.","methodology.h.sources":"Sources used","methodology.h.how":"How the data was assembled","methodology.h.types":"Types of data, and why they must not be mixed","methodology.h.limits":"Limitations","methodology.h.schema":"Data files and schema","methodology.how.body":"Figures were transcribed from the published tables of the NSO Statistical Yearbook (editions 2019 and 2021–2025), which reproduces the Department of Provincial Administration's registration records and the Ministry of Public Health's vital registration. Nothing was scraped at run time and nothing was interpolated. Where a table publishes 95–99 and 100+ separately, the two were added to give a single 95+ group; that is a plain sum, not an estimate. Broad age bands were built by adding published five-year groups: children 0–14, working age 15–59, older 60+. A small 'unknown age' row exists in the source (fewer than 100 people a year) and is excluded from the pyramid but included in the published totals, which is why the pyramid bars sum to slightly less than the headline total.","methodology.types.body":"Registered population, census counts, survey estimates and projections are four different things measured in four different ways. This dashboard keeps them apart: the main time series uses registration records only; census figures are shown separately; projections are drawn with a dashed line and shaded differently, and are never joined to the observed series as if they were the same measurement.","methodology.limits.1":"Registered population counts where people are registered, not where they live. Provinces that receive workers are undercounted; provinces that send them are overcounted.","methodology.limits.2":"Age structure by province is not published in the tables used here, so the provincial view shows totals, sex ratio and density only.","methodology.limits.3":"Births and deaths come from Ministry of Public Health registration and cover 2013–2023. They are on a different basis from the Department of Provincial Administration's own registration counts and should not be compared directly with them.","methodology.limits.4":"The registered series begins in 1998 because that is the earliest year published in the yearbook editions used. Earlier years are available only as census counts, which are shown separately.","methodology.limits.5":"The sharp fall in 2004 reflects the removal of duplicate registration records, not a real fall in population. It is marked on the chart.","methodology.limits.6":"Projections come from the official projection table and are a scenario based on assumptions, not a measurement of the future.","methodology.limits.7":"The age-structure series starts in 2019. The 2017 and 2018 age tables are not comparable with later years: they use a coarser top age group and report about 1.6 million people (non-Thai nationals, transferring population and the central house file) outside the age breakdown. Those two years were excluded rather than adjusted.","methodology.schema.body":"The data ships as one JSON bundle used by the dashboard and one long-format CSV with a single row per combination of year, geography, sex, age group and data type. Replacing either file with an updated extract from the same tables will update the dashboard without any code change.","actions.downloadCsv":"Download filtered data (CSV)","actions.downloadAll":"Download full dataset (CSV)","actions.showTable":"Show data table","actions.hideTable":"Hide data table","actions.copyLink":"Copy link to this view","actions.copied":"Link copied","actions.print":"Print / save as PDF","state.loading":"Loading data…","state.empty":"No data matches these filters.","state.emptyHint":"Try widening the year range or clearing the province filter.","state.unavailable":"Not published for this selection","state.unavailableHint":"The official tables used here do not publish this breakdown, so nothing is shown rather than a zero.","state.error":"The data could not be loaded.","state.errorHint":"Reload the page. If you opened this file directly and it still fails, run it from a local web server.","table.year":"Year","table.metric":"Measure","table.value":"Value","table.viewFor":"Data table for: {title}","footer.built":"Built for classroom use. Figures are official; interpretations are illustrative and should be checked before being relied on.","footer.updated":"Data as published up to the 2025 Statistical Yearbook","footer.license":"Reuse the figures with attribution to the original agencies.","filters.multiHint":"Tick as many as you like. Nothing ticked means everything.","filters.selectedCount":"{n} selected","filters.selectAll":"All","filters.clear":"Clear","filters.search":"Search…","filters.noMatch":"No match","filters.active":"Active filters","filters.clearAll":"Clear Bear in mind that area is not population: Bangkok is one of the smallest provinces on the map and the largest by people, which is why the ranked bars sit beside it. Click a province to filter the whole dashboard to it, and click again to clear.","chart.map.desc":"All {count} provinces, grouped into {regions} regions. Highest: {top}. Lowest: {bottom}.","chart.map.schematic":"Outlines are traced from a published regions map and are approximate; every figure comes from the official tables.","chart.region.title":"Regions compared","chart.region.desc":"The Northeast is the largest region at {top}; the smallest is {bottom}.","chart.map.legendLow":"Low","chart.map.legendHigh":"High","chart.map.legendFew":"Fewer men","chart.map.legendMany":"More men","chart.region.provinces":"Provinces","chart.map.clickHint":"Click a square to filter to that province","chart.map.mergedNote":"This outline covers {other} as well: the source map predates the 2011 split, so the two share one shape. The population figures are separate and correct.","chart.map.descRegion":"All {count} provinces, coloured by the {regions} regions used by the National Statistical Office. Region names are printed on the map, so colour is never the only clue.","nav.sources":"Sources","sourcesPage.badge":"Links straight to the agencies","sourcesPage.title":"Where to find Thai population data","sourcesPage.intro":"The official pages that publish Thailand's population statistics, grouped by topic. Every link goes to the agency's own site, not to a copy we made.","sourcesPage.byTopic":"Sources by topic","sourcesPage.byTopicSub":"Pick the topic that matches your question, then follow the link to the original site.","sourcesPage.unverified":"Official address · our automated check could not open it","ask.heading":"Ask where to find data","ask.sub":"Describe what you need and this will point you at the official pages most likely to hold it.","ask.placeholder":"e.g. I need the number of older people in each province","ask.go" <script>
/* Number, year and text formatting helpers (bilingual). */
window.Fmt = (function () {
  var lang = "th";
  var era = "be";

  function setLang(l) { lang = l; }
  function setEra(e) { era = e; }
  function locale() { return lang === "th" ? "th-TH" : "en-US"; }

  function num(v, digits) {
    if (v === null || v === undefined || isNaN(v)) return "—";
    return Number(v).toLocaleString(locale(), {
      minimumFractionDigits: digits || 0, maximumFractionDigits: digits === undefined ? 0 : digits
    });
  }

  /* 65,951,210 -> "65.95 million" / "65.95 ล้านคน" */
  function big(v, opts) {
    if (v === null || v === undefined || isNaN(v)) return "—";
    var abs = Math.abs(v);
    if (abs >= 1e6) {
      var m = (v / 1e6).toFixed(abs >= 1e7 ? 2 : 2);
      return lang === "th" ? num(parseFloat(m), 2) + " ล้านคน" : num(parseFloat(m), 2) + " million";
    }
    if (abs >= 1e5 && !(opts && opts.exact)) {
      var t = (v / 1e3).toFixed(0);
      return lang === "th" ? num(parseFloat(t)) + " พันคน" : num(parseFloat(t)) + " thousand";
    }
    return num(v) + (lang === "th" ? " คน" : "");
  }

  /* Compact axis labels */
  function axis(v) {
    var abs = Math.abs(v);
    if (abs >= 1e6) return (v / 1e6).toFixed(abs % 1e6 === 0 ? 0 : 1) + (lang === "th" ? " ล." : "M");
    if (abs >= 1e3) return (v / 1e3).toFixed(0) + (lang === "th" ? " พ." : "k");
    return num(v);
  }

  function pct(v, digits) {
    if (v === null || v === undefined || isNaN(v)) return "—";
    return num(v, digits === undefined ? 1 : digits) + "%";
  }

  function signed(v, digits) {
    if (v === null || v === undefined || isNaN(v)) return "—";
    var s = v > 0 ? "+" : (v < 0 ? "−" : "");
    return s + num(Math.abs(v), digits || 0);
  }

  function signedPct(v, digits) {
    if (v === null || v === undefined || isNaN(v)) return "—";
    var s = v > 0 ? "+" : (v < 0 ? "−" : "");
    return s + num(Math.abs(v), digits === undefined ? 2 : digits) + "%";
  }

  /* Year display honours the BE/CE switch. */
  function year(ce, opts) {
    if (ce === null || ce === undefined) return "—";
    if (era === "be") {
      var be = ce + 543;
      if (opts && opts.both) return be + " (" + ce + ")";
      return (lang === "th" ? "พ.ศ. " : "B.E. ") + be;
    }
    return String(ce);
  }

  /* Short year for dense axes */
  function yearShort(ce) { return era === "be" ? String(ce + 543) : String(ce); }

  function template(str, vars) {
    if (!str) return "";
    return str.replace(/\{(\w+)\}/g, function (m, k) {
      return vars && vars[k] !== undefined && vars[k] !== null ? vars[k] : m;
    });
  }

  return {
    setLang: setLang, setEra: setEra, num: num, big: big, axis: axis, pct: pct,
    signed: signed, signedPct: signedPct, year: year, yearShort: yearShort,
    template: template, get lang() { return lang; }, get era() { return era; }
  };
})();

</script>
<script>
/* Accessible multi-select control.
   A button that opens a checkbox list, so any filter can hold several values at
   once. No dependencies; keyboard operable; every visible string is passed in by
   the caller so it stays inside the translation system.

   MultiSelect(container, {
     id, labelledBy,
     options: [{ value, label, disabled, group }],
     selected: [values],
     searchable: bool,
     labels: { all, selectedCount, selectAll, clear, search, none },
     onChange: function (selectedArray) {}
   })
   An empty selection means "all" — that keeps the default state honest and the
   URL short.
*/
window.MultiSelect = function (container, cfg) {
  var opts = [], selected = [], open = false, query = "";
  var root, btn, summary, panel, list, search;

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c];
    });
  }

  function build() {
    container.innerHTML = "";
    root = document.createElement("div");
    root.className = "ms";
    root.innerHTML =
      '<button type="button" class="ms-btn" aria-haspopup="listbox" aria-expanded="false">' +
      '<span class="ms-summary"></span><span class="ms-caret" aria-hidden="true"></span></button>' +
      '<div class="ms-panel" hidden>' +
      '<input type="text" class="ms-search" hidden>' +
      '<div class="ms-actions">' +
      '<button type="button" class="ms-all"></button>' +
      '<button type="button" class="ms-clear"></button>' +
      "</div>" +
      '<div class="ms-list" role="listbox" aria-multiselectable="true" tabindex="-1"></div>' +
      "</div>";
    container.appendChild(root);
    btn = root.querySelector(".ms-btn");
    summary = root.querySelector(".ms-summary");
    panel = root.querySelector(".ms-panel");
    list = root.querySelector(".ms-list");
    search = root.querySelector(".ms-search");
    if (cfg.id) btn.id = cfg.id;
    if (cfg.labelledBy) btn.setAttribute("aria-labelledby", cfg.labelledBy + " " + (cfg.id || ""));

    btn.addEventListener("click", function () { setOpen(!open); });
    btn.addEventListener("keydown", function (e) {
      if (e.key === "ArrowDown" || e.key === "Enter" || e.key === " ") { setOpen(true); e.preventDefault(); focusFirst(); }
    });
    root.querySelector(".ms-all").addEventListener("click", function () {
      selected = visibleValues().filter(function (v) { return !byValue(v).disabled; });
      if (selected.length === opts.filter(function (o) { return !o.disabled; }).length) selected = [];
      emit();
    });
    root.querySelector(".ms-clear").addEventListener("click", function () { selected = []; emit(); });
    search.addEventListener("input", function () { query = search.value.toLowerCase(); renderList(); });
    search.addEventListener("keydown", function (e) {
      if (e.key === "Escape") { setOpen(false); btn.focus(); }
      if (e.key === "ArrowDown") { focusFirst(); e.preventDefault(); }
    });
    list.addEventListener("change", function (e) {
      var cb = e.target;
      if (!cb.matches("input[type=checkbox]")) return;
      var v = cb.value;
      var i = selected.indexOf(v);
      if (cb.checked && i < 0) selected.push(v);
      if (!cb.checked && i >= 0) selected.splice(i, 1);
      emit();
    });
    list.addEventListener("keydown", function (e) {
      var rows = [].slice.call(list.querySelectorAll("input[type=checkbox]:not(:disabled)"));
      var i = rows.indexOf(document.activeElement);
      if (e.key === "ArrowDown") { (rows[i + 1] || rows[0]).focus(); e.preventDefault(); }
      else if (e.key === "ArrowUp") { (rows[i - 1] || rows[rows.length - 1]).focus(); e.preventDefault(); }
      else if (e.key === "Escape") { setOpen(false); btn.focus(); e.preventDefault(); }
    });
    document.addEventListener("click", function (e) {
      if (open && !root.contains(e.target)) setOpen(false);
    });
    document.addEventListener("keydown", function (e) {
      if (open && e.key === "Escape") { setOpen(false); btn.focus(); }
    });
  }

  function byValue(v) {
    return opts.filter(function (o) { return o.value === v; })[0] || {};
  }
  function visibleValues() {
    return filtered().map(function (o) { return o.value; });
  }
  function filtered() {
    if (!query) return opts;
    return opts.filter(function (o) { return o.label.toLowerCase().indexOf(query) >= 0; });
  }
  function focusFirst() {
    var f = list.querySelector("input[type=checkbox]:not(:disabled)");
    if (f) f.focus();
  }

  function setOpen(v) {
    open = v;
    panel.hidden = !v;
    root.setAttribute("data-open", v ? "true" : "false");
    btn.setAttribute("aria-expanded", v ? "true" : "false");
    if (v && cfg.searchable) { search.value = query; search.focus(); }
  }

  function renderSummary() {
    var L = cfg.labels || {};
    if (!selected.length) { summary.textContent = L.all || "All"; root.classList.remove("has-sel"); return; }
    root.classList.add("has-sel");
    if (selected.length === 1) { summary.textContent = byValue(selected[0]).label || selected[0]; return; }
    summary.textContent = (L.selectedCount || "{n} selected").replace("{n}", selected.length);
  }

  function renderList() {
    var L = cfg.labels || {};
    search.hidden = !cfg.searchable;
    search.placeholder = L.search || "";
    root.querySelector(".ms-all").textContent = L.selectAll || "All";
    root.querySelector(".ms-clear").textContent = L.clear || "Clear";
    var rows = filtered();
    if (!rows.length) { list.innerHTML = '<p class="ms-empty">' + esc(L.none || "—") + "</p>"; return; }
    var html = "", lastGroup = null;
    rows.forEach(function (o) {
      if (o.group && o.group !== lastGroup) {
        html += '<p class="ms-group">' + esc(o.group) + "</p>";
        lastGroup = o.group;
      }
      html += '<label class="ms-row' + (o.disabled ? " is-disabled" : "") + '">' +
        '<input type="checkbox" value="' + esc(o.value) + '"' +
        (selected.indexOf(o.value) >= 0 ? " checked" : "") +
        (o.disabled ? " disabled" : "") + ">" +
        "<span>" + esc(o.label) + "</span></label>";
    });
    list.innerHTML = html;
  }

  function emit() {
    renderSummary();
    renderList();
    if (cfg.onChange) cfg.onChange(selected.slice());
  }

  build();

  var api = {
    /* Re-supply options/labels without closing the panel, so several boxes can
       be ticked in one go even though the charts redraw in between. */
    update: function (next) {
      var scroll = list.scrollTop;
      if (next.options) opts = next.options;
      if (next.selected) selected = next.selected.slice();
      if (next.labels) cfg.labels = next.labels;
      if (next.searchable !== undefined) cfg.searchable = next.searchable;
      /* drop selections that no longer exist */
      selected = selected.filter(function (v) { return opts.some(function (o) { return o.value === v; }); });
      renderSummary();
      renderList();
      list.scrollTop = scroll;
      return selected.slice();
    },
    value: function () { return selected.slice(); },
    close: function () { setOpen(false); }
  };
  api.update({ options: cfg.options || [], selected: cfg.selected || [] });
  return api;
};

</script>
<script>
/* Reusable SVG chart components.
   No external dependencies: every chart is drawn as plain SVG so the dashboard
   works offline and from a single file. Each chart ships a hover tooltip,
   keyboard navigation and a bilingual text description. */
window.Charts = (function () {
  var NS = "http://www.w3.org/2000/svg";

  function el(tag, attrs, parent) {
    var n = document.createElementNS(NS, tag);
    if (attrs) for (var k in attrs) if (attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }
  function txt(parent, x, y, s, cls, anchor, extra) {
    var t = el("text", Object.assign({ x: x, y: y, "text-anchor": anchor || "start", class: cls || "tick-text" }, extra || {}), parent);
    t.textContent = s;
    return t;
  }
  function cssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }
  function niceTicks(min, max, count) {
    var span = max - min;
    if (span <= 0) return [min];
    var step = Math.pow(10, Math.floor(Math.log10(span / count)));
    var err = (span / count) / step;
    if (err >= 7.5) step *= 10; else if (err >= 3.5) step *= 5; else if (err >= 1.5) step *= 2;
    var out = [], v = Math.ceil(min / step) * step;
    for (; v <= max + step * 0.001; v += step) out.push(Math.round(v * 1e6) / 1e6);
    return out;
  }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  /* ---------------------------------------------------------------- mount */
  function mount(container, opts) {
    container.innerHTML = "";
    var box = document.createElement("div");
    box.className = "chart-box";
    box.tabIndex = 0;
    box.setAttribute("role", "img");
    container.appendChild(box);

    var tip = document.createElement("div");
    tip.className = "tooltip";
    tip.setAttribute("role", "status");
    box.appendChild(tip);

    var api = {
      box: box, tip: tip, svg: null, state: { hover: null },
      showTip: function (html, x, y) {
        tip.innerHTML = html;
        tip.classList.add("on");
        var w = tip.offsetWidth, h = tip.offsetHeight, bw = box.clientWidth;
        tip.style.left = clamp(x + 14, 4, Math.max(4, bw - w - 4)) + "px";
        tip.style.top = Math.max(4, y - h - 12) + "px";
      },
      hideTip: function () { tip.classList.remove("on"); }
    };

    var raf = null;
    function draw() {
      var w = box.clientWidth || container.clientWidth || 640;
      if (api.svg) api.svg.remove();
      api.svg = el("svg", { width: "100%", viewBox: null }, null);
      box.insertBefore(api.svg, tip);
      opts.draw(api, w);
    }
    api.redraw = function () {
      if (raf) cancelAnimationFrame(raf);
      raf = requestAnimationFrame(draw);
    };
    if (window.ResizeObserver) {
      var last = 0;
      new ResizeObserver(function () {
        var w = box.clientWidth;
        if (Math.abs(w - last) > 6) { last = w; api.redraw(); }
      }).observe(box);
    } else {
      window.addEventListener("resize", api.redraw);
    }
    draw();
    return api;
  }

  /* ------------------------------------------------------------ line chart */
  /* cfg: { points:[{x, type, v:{key:num}}], series:[{key,label,color}],
            markers:[{x,label,note}], desc, fmtY, fmtX, yFromZero } */
  function lineChart(container, cfg) {
    return mount(container, {
      draw: function (api, W) {
        var pts = cfg.points.filter(function (p) {
          return cfg.series.some(function (s) { return p.v[s.key] !== null && p.v[s.key] !== undefined; });
        });
        if (!pts.length) return;
        var H = cfg.height || Math.max(230, Math.min(360, W * 0.42));
        var m = { t: 18, r: 16, b: 34, l: 56 };
        var iw = Math.max(40, W - m.l - m.r), ih = H - m.t - m.b;
        api.svg.setAttribute("viewBox", "0 0 " + W + " " + H);
        api.svg.setAttribute("height", H);

        var vals = [];
        pts.forEach(function (p) { cfg.series.forEach(function (s) { if (p.v[s.key] != null) vals.push(p.v[s.key]); }); });
        var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
        if (cfg.yFromZero) lo = 0;
        var pad = (hi - lo) * 0.12 || hi * 0.05 || 1;
        var y0 = cfg.yFromZero ? 0 : lo - pad, y1 = hi + pad;
        var xs = pts.map(function (p) { return p.x; });
        var xmin = Math.min.apply(null, xs), xmax = Math.max.apply(null, xs);
        var X = function (x) { return m.l + (xmax === xmin ? iw / 2 : (x - xmin) / (xmax - xmin) * iw); };
        var Y = function (v) { return m.t + ih - (v - y0) / (y1 - y0) * ih; };

        var g = el("g", {}, api.svg);
        niceTicks(y0, y1, 5).forEach(function (t) {
          el("line", { x1: m.l, x2: m.l + iw, y1: Y(t), y2: Y(t), class: "grid-line" }, g);
          txt(g, m.l - 8, Y(t) + 4, (cfg.fmtY || Fmt.axis)(t), "tick-text", "end");
        });
        el("line", { x1: m.l, x2: m.l + iw, y1: m.t + ih, y2: m.t + ih, class: "axis-line" }, g);

        var every = Math.ceil(pts.length / Math.max(3, Math.floor(iw / 62)));
        pts.forEach(function (p, i) {
          if (i % every !== 0 && i !== pts.length - 1) return;
          txt(g, X(p.x), m.t + ih + 18, (cfg.fmtX || Fmt.yearShort)(p.x), "tick-text", "middle");
        });

        /* markers */
        (cfg.markers || []).forEach(function (mk) {
          if (mk.x < xmin || mk.x > xmax) return;
          el("line", { x1: X(mk.x), x2: X(mk.x), y1: m.t, y2: m.t + ih, class: "marker-line" }, g);
          var tx = X(mk.x), anchor = tx > m.l + iw * 0.7 ? "end" : "start";
          txt(g, tx + (anchor === "end" ? -5 : 5), m.t + 11, mk.label, "marker-text", anchor);
        });

        /* series: observed solid, projection dashed */
        cfg.series.forEach(function (s) {
          var runs = [], cur = null;
          pts.forEach(function (p) {
            var v = p.v[s.key];
            if (v == null) { cur = null; return; }
            var kind = p.type === "projection" ? "p" : "o";
            /* Runs of different data types are never joined: a projection is a
               different kind of measurement, so it is drawn as its own segment. */
            if (!cur || cur.kind !== kind) { cur = { kind: kind, pts: [] }; runs.push(cur); }
            cur.pts.push({ x: p.x, y: v });
          });
          runs.forEach(function (r) {
            if (r.pts.length === 1) {
              el("circle", { cx: X(r.pts[0].x), cy: Y(r.pts[0].y), r: 4, fill: s.color }, g);
              return;
            }
            if (r.pts.length < 2) return;
            var d = r.pts.map(function (q, i) { return (i ? "L" : "M") + X(q.x) + " " + Y(q.y); }).join(" ");
            el("path", {
              d: d, fill: "none", stroke: s.color, "stroke-width": 2,
              "stroke-linecap": "round", "stroke-linejoin": "round",
              "stroke-dasharray": r.kind === "p" ? "6 5" : null
            }, g);
          });
          var lastP = null;
          for (var i = pts.length - 1; i >= 0; i--) if (pts[i].v[s.key] != null) { lastP = pts[i]; break; }
          if (lastP && cfg.series.length <= 4) {
            var lx = X(lastP.x), ly = Y(lastP.v[s.key]);
            el("circle", { cx: lx, cy: ly, r: 4, fill: s.color, stroke: cssVar("--surface-1"), "stroke-width": 2 }, g);
          }
        });

        /* hover layer */
        var hoverG = el("g", { style: "display:none" }, api.svg);
        var vline = el("line", { y1: m.t, y2: m.t + ih, class: "marker-line" }, hoverG);
        var dots = cfg.series.map(function (s) {
          return el("circle", { r: 4.5, fill: s.color, stroke: cssVar("--surface-1"), "stroke-width": 2 }, hoverG);
        });

        function focus(i, clientPos) {
          var p = pts[i]; if (!p) return;
          hoverG.style.display = "";
          vline.setAttribute("x1", X(p.x)); vline.setAttribute("x2", X(p.x));
          cfg.series.forEach(function (s, k) {
            var v = p.v[s.key];
            if (v == null) { dots[k].style.display = "none"; return; }
            dots[k].style.display = "";
            dots[k].setAttribute("cx", X(p.x)); dots[k].setAttribute("cy", Y(v));
          });
          var rows = cfg.series.map(function (s) {
            var v = p.v[s.key];
            return '<div class="tt-row"><span class="k"><span class="dot" style="background:' + s.color + '"></span>' +
              s.label + '</span><span class="v">' + (v == null ? "—" : Fmt.num(v)) + "</span></div>";
          }).join("");
          var note = p.type === "projection" ? '<div class="tt-note">' + (cfg.projectionNote || "") + "</div>" : "";
          if (cfg.tooltipExtra) note = (cfg.tooltipExtra(p) || "") + note;
          api.showTip('<div class="tt-title">' + Fmt.year(p.x) + "</div>" + rows + note,
            clientPos ? clientPos.x : X(p.x), clientPos ? clientPos.y : Y(y1) + 40);
          api.state.hover = i;
        }
        function nearest(mx) {
          var best = 0, bd = Infinity;
          pts.forEach(function (p, i) { var d = Math.abs(X(p.x) - mx); if (d < bd) { bd = d; best = i; } });
          return best;
        }
        el("rect", { x: m.l, y: m.t, width: iw, height: ih, fill: "transparent" }, api.svg)
          .addEventListener("mousemove", function (e) {
            var r = api.box.getBoundingClientRect();
            focus(nearest(e.clientX - r.left), { x: e.clientX - r.left, y: e.clientY - r.top });
          });
        api.box.addEventListener("mouseleave", function () { hoverG.style.display = "none"; api.hideTip(); });
        api.box.onkeydown = function (e) {
          var i = api.state.hover == null ? pts.length - 1 : api.state.hover;
          if (e.key === "ArrowRight") { focus(Math.min(pts.length - 1, i + 1)); e.preventDefault(); }
          else if (e.key === "ArrowLeft") { focus(Math.max(0, i - 1)); e.preventDefault(); }
          else if (e.key === "Home") { focus(0); e.preventDefault(); }
          else if (e.key === "End") { focus(pts.length - 1); e.preventDefault(); }
          else if (e.key === "Escape") { hoverG.style.display = "none"; api.hideTip(); api.state.hover = null; }
        };
        api.box.setAttribute("aria-label", cfg.desc || "");
      }
    });
  }

  /* --------------------------------------------------------- stacked area */
  /* cfg: { points:[{x,type,parts:{key:val}}], parts:[{key,label,color}], mode:'pct'|'abs' } */
  function stackedArea(container, cfg) {
    return mount(container, {
      draw: function (api, W) {
        var pts = cfg.points;
        if (!pts.length) return;
        var H = cfg.height || Math.max(240, Math.min(370, W * 0.44));
        var m = { t: 16, r: 16, b: 34, l: 52 };
        var iw = Math.max(40, W - m.l - m.r), ih = H - m.t - m.b;
        api.svg.setAttribute("viewBox", "0 0 " + W + " " + H);
        api.svg.setAttribute("height", H);

        var totals = pts.map(function (p) {
          return cfg.parts.reduce(function (a, s) { return a + (p.parts[s.key] || 0); }, 0);
        });
        var maxTotal = cfg.mode === "pct" ? 100 : Math.max.apply(null, totals) * 1.02;
        var xs = pts.map(function (p) { return p.x; });
        var xmin = Math.min.apply(null, xs), xmax = Math.max.apply(null, xs);
        var X = function (x) { return m.l + (xmax === xmin ? iw / 2 : (x - xmin) / (xmax - xmin) * iw); };
        var Y = function (v) { return m.t + ih - v / maxTotal * ih; };

        var g = el("g", {}, api.svg);
        niceTicks(0, maxTotal, 5).forEach(function (t) {
          el("line", { x1: m.l, x2: m.l + iw, y1: Y(t), y2: Y(t), class: "grid-line" }, g);
          txt(g, m.l - 8, Y(t) + 4, cfg.mode === "pct" ? t + "%" : Fmt.axis(t), "tick-text", "end");
        });
        var every = Math.ceil(pts.length / Math.max(3, Math.floor(iw / 58)));
        pts.forEach(function (p, i) {
          if (i % every !== 0 && i !== pts.length - 1) return;
          txt(g, X(p.x), m.t + ih + 18, Fmt.yearShort(p.x), "tick-text", "middle");
        });

        /* cumulative bands, drawn bottom-up with a 2px surface gap between them */
        var cum = pts.map(function () { return 0; });
        cfg.parts.forEach(function (s, si) {
          var top = [], bottom = [];
          pts.forEach(function (p, i) {
            var raw = p.parts[s.key] || 0;
            var v = cfg.mode === "pct" ? raw / totals[i] * 100 : raw;
            bottom.push({ x: X(p.x), y: Y(cum[i]) });
            cum[i] += v;
            top.push({ x: X(p.x), y: Y(cum[i]) });
          });
          var d = top.map(function (q, i) { return (i ? "L" : "M") + q.x + " " + q.y; }).join(" ") + " " +
            bottom.slice().reverse().map(function (q) { return "L" + q.x + " " + q.y; }).join(" ") + " Z";
          el("path", {
            d: d, fill: s.color, stroke: cssVar("--surface-1"), "stroke-width": si ? 2 : 0,
            "fill-opacity": 1
          }, g);
        });

        /* projection overlay: hatch the projected years */
        var firstProj = pts.findIndex(function (p) { return p.type === "projection"; });
        if (firstProj > 0) {
          var px = X(pts[firstProj - 1].x);
          var pid = "hatch-" + Math.random().toString(36).slice(2, 8);
          var defs = el("defs", {}, api.svg);
          /* A light hatch marks the projected years. Kept faint on purpose:
             it has to read as "different kind of data", not as a pattern. */
          var pat = el("pattern", { id: pid, width: 10, height: 10, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)" }, defs);
          el("line", { x1: 0, y1: 0, x2: 0, y2: 10, stroke: cssVar("--surface-1"), "stroke-width": 1.6, "stroke-opacity": 0.42 }, pat);
          el("rect", { x: px, y: m.t, width: m.l + iw - px, height: ih, fill: "url(#" + pid + ")" }, g);
          el("line", { x1: px, x2: px, y1: m.t, y2: m.t + ih, stroke: cssVar("--surface-1"), "stroke-width": 2, "stroke-dasharray": "5 4" }, g);
          txt(g, X(pts[pts.length - 1].x), m.t - 4, cfg.projectionLabel || "", "marker-text", "end");
        }

        /* direct labels on the right edge */
        var cum2 = 0, lastIdx = pts.length - 1;
        cfg.parts.forEach(function (s) {
          var raw = pts[lastIdx].parts[s.key] || 0;
          var v = cfg.mode === "pct" ? raw / totals[lastIdx] * 100 : raw;
          var mid = Y(cum2 + v / 2); cum2 += v;
          if (v / maxTotal * ih > 22) {
            var t = txt(g, m.l + iw - 8, mid + 4, cfg.mode === "pct" ? Fmt.pct(v) : Fmt.axis(raw), "series-label", "end");
            t.setAttribute("fill", "#fff");
            t.setAttribute("paint-order", "stroke");
            t.setAttribute("stroke", "rgba(0,0,0,.28)");
            t.setAttribute("stroke-width", "3");
          }
        });

        var vline = el("line", { y1: m.t, y2: m.t + ih, class: "marker-line", style: "display:none" }, api.svg);
        function focus(i, pos) {
          var p = pts[i]; if (!p) return;
          vline.style.display = ""; vline.setAttribute("x1", X(p.x)); vline.setAttribute("x2", X(p.x));
          var rows = cfg.parts.slice().reverse().map(function (s) {
            var raw = p.parts[s.key] || 0;
            var share = totals[i] ? raw / totals[i] * 100 : 0;
            return '<div class="tt-row"><span class="k"><span class="dot" style="background:' + s.color + '"></span>' +
              s.label + '</span><span class="v">' + Fmt.num(raw) + " · " + Fmt.pct(share) + "</span></div>";
          }).join("");
          var note = p.type === "projection" ? '<div class="tt-note">' + (cfg.projectionNote || "") + "</div>" : "";
          api.showTip('<div class="tt-title">' + Fmt.year(p.x) + "</div>" + rows + note,
            pos ? pos.x : X(p.x), pos ? pos.y : m.t + 40);
          api.state.hover = i;
        }
        el("rect", { x: m.l, y: m.t, width: iw, height: ih, fill: "transparent" }, api.svg)
          .addEventListener("mousemove", function (e) {
            var r = api.box.getBoundingClientRect(), mx = e.clientX - r.left, best = 0, bd = Infinity;
            pts.forEach(function (p, i) { var d = Math.abs(X(p.x) - mx); if (d < bd) { bd = d; best = i; } });
            focus(best, { x: mx, y: e.clientY - r.top });
          });
        api.box.addEventListener("mouseleave", function () { vline.style.display = "none"; api.hideTip(); });
        api.box.onkeydown = function (e) {
          var i = api.state.hover == null ? pts.length - 1 : api.state.hover;
          if (e.key === "ArrowRight") { focus(Math.min(pts.length - 1, i + 1)); e.preventDefault(); }
