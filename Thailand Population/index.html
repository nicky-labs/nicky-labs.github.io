  /* --------------------------------------------------------------- map */
  /* One hue per region. Chosen by search and checked with the data-viz
     validator: on all 21 pairs the worst colour-blind separation is ΔE 8.1 and
     the worst normal-vision separation is ΔE 15.9, both above their floors.
     Two of the pastels sit just above the lightness band (0.80 vs a 0.77 cap),
     which is the price of a light, friendly palette; region names are printed
     on the map and in every tooltip so colour never carries identity alone.
     The same hexes serve both themes, so a region keeps its colour when the
     theme is switched. */
  var REGION_COLORS = {
    north: "#6975d8", northeast: "#c93a82", central: "#c68bff", bkk: "#70d79a",
    east: "#ffa659", west: "#e65909", south: "#06aac7"
  };

  var MAP_STEPS_LIGHT = ["#86b6ef", "#5598e7", "#2a78d6", "#1c5cab", "#0d366b"];
  var MAP_STEPS_DARK = ["#cde2fb", "#9ec5f4", "#6da7ec", "#3987e5", "#184f95"];
  /* Sex ratio is the one measure with a natural midpoint (100 = equal numbers),
     so it gets a diverging scale rather than a one-hue ramp. */
  var SEX_STEPS_LIGHT = ["#e34948", "#ef9b9a", "#f0efec", "#86b6ef", "#2a78d6"];
  var SEX_STEPS_DARK = ["#e66767", "#ea8f8f", "#383835", "#6da7ec", "#3987e5"];

  function byRegion() { return S.mapMeasure === "region"; }
  function measureKey() {
    return { pop: "total", density: "density", sex: "sex_ratio" }[S.mapMeasure] || "total";
  }
  function measureLabel() {
    if (byRegion()) return t("filters.region");
    return t("chart.province." + (S.mapMeasure === "pop" ? "sortPop"
      : S.mapMeasure === "density" ? "sortDensity" : "sortSexRatio"));
  }
  function measureFmt(v) {
    if (S.mapMeasure === "pop" || byRegion()) return Fmt.num(v);
    return Fmt.num(v, 1);
  }

  function renderMap() {
    var dark = S.theme === "dark";
    var key = measureKey();
    var provs = D.provinces;
    setText("mapSub", t("chart.map.sub", { measure: measureLabel(), year: Fmt.year(2024) }));

    var steps, binOf;
    if (byRegion()) {
      var order = D.regions.map(function (r) { return r.region_code; });
      steps = order.map(function (c) { return REGION_COLORS[c]; });
      binOf = function (v) { return v; };
    } else if (S.mapMeasure === "sex") {
      steps = dark ? SEX_STEPS_DARK : SEX_STEPS_LIGHT;
      /* fixed, symmetric cuts around 100 so the midpoint always means "equal" */
      binOf = function (v) { return v < 93 ? 0 : v < 96 ? 1 : v < 99 ? 2 : v < 101 ? 3 : 4; };
    } else {
      steps = dark ? MAP_STEPS_DARK : MAP_STEPS_LIGHT;
      /* quintiles of the observed values — equal counts per shade */
      var sorted = provs.map(function (p) { return p[key]; }).sort(function (a, b) { return a - b; });
      var cuts = [0.2, 0.4, 0.6, 0.8].map(function (q) { return sorted[Math.floor(q * sorted.length)]; });
      binOf = function (v) {
        for (var i = 0; i < cuts.length; i++) if (v < cuts[i]) return i;
        return cuts.length;
      };
    }

    var regionName = {};
    D.regions.forEach(function (r) { regionName[r.region_code] = LANG === "th" ? r.region_th : r.region_en; });
    var regionShort = {
      bkk: LANG === "th" ? "กทม./ปริมณฑล" : "Bangkok", central: LANG === "th" ? "กลาง" : "Central",
      east: LANG === "th" ? "ตะวันออก" : "East", west: LANG === "th" ? "ตะวันตก" : "West",
      north: LANG === "th" ? "เหนือ" : "North", northeast: LANG === "th" ? "อีสาน" : "Northeast",
      south: LANG === "th" ? "ใต้" : "South"
    };

    var selRegion = S.region, selProv = S.province;
    var dimFn = (selRegion.length || selProv.length)
      ? function (d) {
        if (selProv.length) return selProv.indexOf(d.code) >= 0;
        return selRegion.indexOf(d.region) >= 0;
      } : null;

    var mergedWith = {};
    (D.map.merged || []).forEach(function (m) { mergedWith[m[0]] = m[1]; mergedWith[m[1]] = m[0]; });
    var nameOf = {};
    provs.forEach(function (p) { nameOf[p.province_code] = LANG === "th" ? p.province_th : p.province_en; });

    var tiles = provs.map(function (p) {
      return {
        code: p.province_code, region: p.region_code,
        note: mergedWith[p.province_code]
          ? t("chart.map.mergedNote", { other: nameOf[mergedWith[p.province_code]] }) : null,
        label: LANG === "th" ? p.province_th : p.province_en,
        regionLabel: regionName[p.region_code], regionShort: regionShort[p.region_code],
        value: byRegion() ? D.regions.map(function (r) { return r.region_code; }).indexOf(p.region_code) : p[key],
        rows: [
          { k: t("chart.province.tooltipPop"), v: Fmt.num(p.total) },
          { k: t("chart.province.tooltipShare"), v: Fmt.pct(p.share, 2) },
          { k: t("chart.province.tooltipSex"), v: Fmt.num(p.sex_ratio, 1) },
          { k: t("chart.province.tooltipDensity"), v: Fmt.num(p.density, 1) + " " + t("chart.province.densityUnit") }
        ]
      };
    });

    var ranked = provs.slice().sort(function (a, b) { return b[key] - a[key]; });
    var desc = byRegion() ? t("chart.map.descRegion", {
      count: provs.length, regions: D.regions.length
    }) : t("chart.map.desc", {
      count: provs.length, regions: D.regions.length,
      top: LANG === "th" ? ranked[0].province_th : ranked[0].province_en,
      bottom: LANG === "th" ? ranked[ranked.length - 1].province_th : ranked[ranked.length - 1].province_en
    });

    if (byRegion()) {
      legend("mapLegend", D.regions.slice().sort(function (a, b) { return b.total - a.total; })
        .map(function (r) {
          return { color: REGION_COLORS[r.region_code], label: regionShort[r.region_code] };
        }));
    } else {
      $("mapLegend").innerHTML = '<span class="scale-legend"><span class="lo">' +
        esc(S.mapMeasure === "sex" ? t("chart.map.legendFew") : t("chart.map.legendLow")) + "</span>" +
        steps.map(function (c) { return '<span class="sw" style="background:' + c + '"></span>'; }).join("") +
        '<span class="hi">' + esc(S.mapMeasure === "sex" ? t("chart.map.legendMany") : t("chart.map.legendHigh")) +
        "</span></span>";
    }

    charts.map = Charts.geoMap($("mapChart"), {
      shapes: D.map.shapes, regionShapes: D.map.regionShapes,
      regionAnchor: D.map.regionAnchor, width: D.map.width, height: D.map.height,
      items: tiles, steps: steps, binOf: binOf, dim: dimFn,
      regionLabelOf: function (r) { return regionShort[r]; },
      labelOffset: { bkk: [-46, 10], central: [-4, -6], west: [-10, 0] },
      note: t("chart.map.clickHint"), desc: desc,
      onSelect: function (code) {
        var i = S.province.indexOf(code);
        if (i >= 0) S.province.splice(i, 1); else S.province.push(code);
        renderAll();
      }
    });
    setText("mapDesc", desc + " " + t("chart.map.schematic"));

    /* --- regions compared --- */
    var regionRanked = D.regions.slice().sort(function (a, b) {
      return (b[key === "total" ? "total" : key] || 0) - (a[key === "total" ? "total" : key] || 0);
    });
    var regionValue = function (r) {
      if (S.mapMeasure === "pop" || byRegion()) return r.total;
      if (S.mapMeasure === "sex") return r.sex_ratio;
      var rows2 = D.provinces.filter(function (p) { return p.region_code === r.region_code; });
      return rows2.reduce(function (a, p) { return a + p.total; }, 0) /
        rows2.reduce(function (a, p) { return a + p.total / p.density; }, 0);
    };
    regionRanked = D.regions.slice().sort(function (a, b) { return regionValue(b) - regionValue(a); });

    var divergeAt = S.mapMeasure === "sex" ? 100 : null;
    var barColorFor = function (v) {
      if (divergeAt === null) return color("age-work");
      return v >= divergeAt ? color("male") : color("female");
    };
    if (byRegion()) barColorFor = function () { return color("age-work"); };
    charts.region = Charts.hbar($("regionChart"), {
      fmtValue: measureFmt, baseline: divergeAt,
      items: regionRanked.map(function (r) {
        return {
          label: regionShort[r.region_code],
          fullLabel: LANG === "th" ? r.region_th : r.region_en,
          value: regionValue(r),
          color: byRegion() ? REGION_COLORS[r.region_code] : barColorFor(regionValue(r)),
          rows: [
            { k: t("chart.province.tooltipPop"), v: Fmt.num(r.total) },
            { k: t("chart.province.tooltipShare"), v: Fmt.pct(r.share, 2) },
            { k: t("chart.province.tooltipSex"), v: Fmt.num(r.sex_ratio, 1) },
            { k: t("chart.region.provinces"), v: Fmt.num(r.provinces) }
          ]
        };
      }),
      desc: t("chart.region.desc", {
        top: LANG === "th" ? regionRanked[0].region_th : regionRanked[0].region_en,
        bottom: LANG === "th" ? regionRanked[regionRanked.length - 1].region_th
          : regionRanked[regionRanked.length - 1].region_en
      })
    });

    table("regionTable",
      [t("filters.region"), t("chart.region.provinces"), t("sex.total"), t("sex.male"),
      t("sex.female"), t("chart.province.tooltipSex"), t("chart.province.tooltipShare")],
      D.regions.slice().sort(function (a, b) { return b.total - a.total; }).map(function (r) {
        return [LANG === "th" ? r.region_th : r.region_en, Fmt.num(r.provinces),
        Fmt.num(r.total), Fmt.num(r.male), Fmt.num(r.female),
        Fmt.num(r.sex_ratio, 1), Fmt.pct(r.share, 2)];
      }));

    document.querySelectorAll("#mapMeasure button").forEach(function (b) {
      b.setAttribute("aria-pressed", b.dataset.measure === S.mapMeasure ? "true" : "false");
    });
    sourceNote("regionSource", "dopa_pop_province", Fmt.year(2024),
      t("chart.province.ageNote") + "<br>" + t("chart.map.schematic"), true);
  }

  /* ------------------------------------------------------------ provinces */
  function renderProvince() {
    var rows = D.provinces.slice();
    if (S.region.length) rows = rows.filter(function (p) { return S.region.indexOf(p.region_code) >= 0; });
    if (S.province.length) rows = rows.filter(function (p) { return S.province.indexOf(p.province_code) >= 0; });

    var sortKey = measureKey();
    rows.sort(function (a, b) { return b[sortKey] - a[sortKey]; });
    var limit = S.provTop === "all" ? rows.length : parseInt(S.provTop, 10);
    var shown = rows.slice(0, limit);

    if (!shown.length) {
      $("provChart").innerHTML = '<div class="state"><strong>' + t("state.empty") + "</strong><span>" + t("state.emptyHint") + "</span></div>";
      $("provDesc").textContent = ""; return;
    }
    var barColor = color("age-work");

    var fmtValue = measureFmt;
    function provDescText(rows2) {
      return t("chart.province.desc", {
        count: rows2.length,
        measure: byRegion() ? t("chart.province.sortPop") : measureLabel(),
        top: LANG === "th" ? rows2[0].province_th : rows2[0].province_en,
        topPop: measureFmt(rows2[0][sortKey]),
        bottom: LANG === "th" ? rows2[rows2.length - 1].province_th : rows2[rows2.length - 1].province_en,
        bottomPop: measureFmt(rows2[rows2.length - 1][sortKey])
      });
    }
    charts.prov = Charts.hbar($("provChart"), {
      fmtValue: fmtValue, note: t("chart.province.ageNote"),
      baseline: S.mapMeasure === "sex" ? 100 : null,
      items: shown.map(function (p) {
        return {
          label: LANG === "th" ? p.province_th : p.province_en,
          fullLabel: (LANG === "th" ? p.province_th : p.province_en),
          value: p[sortKey],
          color: byRegion() ? REGION_COLORS[p.region_code]
            : (S.mapMeasure === "sex" ? (p[sortKey] >= 100 ? color("male") : color("female")) : barColor),
          rows: [
            { k: t("chart.province.tooltipPop"), v: Fmt.num(p.total) },
            { k: t("chart.province.tooltipShare"), v: Fmt.pct(p.share, 2) },
            { k: t("chart.province.tooltipSex"), v: Fmt.num(p.sex_ratio, 1) },
            { k: t("chart.province.tooltipDensity"), v: Fmt.num(p.density, 1) + " " + t("chart.province.densityUnit") }
          ]
        };
      }),
      desc: provDescText(shown)
    });
    $("provDesc").textContent = provDescText(shown);
    table("provTable",
      [t("filters.province"), t("filters.region"), t("sex.total"), t("sex.male"), t("sex.female"),
      t("chart.province.tooltipSex"), t("chart.province.tooltipDensity"), t("chart.province.tooltipShare")],
      rows.map(function (p) {
        var reg = D.regions.filter(function (r) { return r.region_code === p.region_code; })[0];
        return [LANG === "th" ? p.province_th : p.province_en, LANG === "th" ? reg.region_th : reg.region_en,
        Fmt.num(p.total), Fmt.num(p.male), Fmt.num(p.female), Fmt.num(p.sex_ratio, 1),
        Fmt.num(p.density, 1), Fmt.pct(p.share, 2)];
      }));

  }

  /* -------------------------------------------------------- two-year view */
  function renderCompare() {
    var a = byYear(S.compare), b = byYear(S.year);
    $("compareSub").textContent = t("chart.compare.sub", { a: Fmt.year(S.compare), b: Fmt.year(S.year) });
    if (!a || !b || a.year_ce === b.year_ce) {
      $("compareChart").innerHTML = '<div class="state"><strong>' + t("state.unavailable") + "</strong><span>" + t("state.unavailableHint") + "</span></div>";
      $("compareSummary").textContent = ""; $("compareTable").innerHTML = ""; $("compareWarn").innerHTML = "";
      legend("compareLegend", []);
      sourceNote("compareSource", "dopa_pop_year", "—"); return;
    }
    var vA = D.vital.filter(function (v) { return v.year_ce === a.year_ce; })[0];
    var vB = D.vital.filter(function (v) { return v.year_ce === b.year_ce; })[0];

    var rows = [
      { k: "card.total.label", a: a.total, b: b.total },
      { k: "card.male.label", a: a.male, b: b.male },
      { k: "card.female.label", a: a.female, b: b.female },
      { k: "card.children.label", a: a.children, b: b.children },
      { k: "card.working.label", a: a.working, b: b.working },
      { k: "card.older.label", a: a.older, b: b.older },
      { k: "card.dependency.label", a: a.dependency_ratio, b: b.dependency_ratio, plain: true },
      { k: "card.sexRatio.label", a: a.sex_ratio, b: b.sex_ratio, plain: true },
      { k: "card.births.label", a: vA ? vA.births : null, b: vB ? vB.births : null },
      { k: "card.deaths.label", a: vA ? vA.deaths : null, b: vB ? vB.deaths : null }
    ];

    legend("compareLegend", [
      { color: color("seq-2"), label: Fmt.year(a.year_ce) },
      { color: color("accent"), label: Fmt.year(b.year_ce) }
    ]);
    charts.compare = Charts.compareBars($("compareChart"), {
      colorA: color("seq-2"), colorB: color("accent"),
      labelA: Fmt.year(a.year_ce), labelB: Fmt.year(b.year_ce),
      rows: rows.filter(function (r) { return r.a != null && r.b != null; }).map(function (r) {
        return { label: t(r.k), a: r.a, b: r.b, fmt: r.plain ? function (v) { return Fmt.num(v, 1); } : Fmt.axis };
      }),
      desc: t("chart.compare.sub", { a: Fmt.year(a.year_ce), b: Fmt.year(b.year_ce) })
    });

    table("compareTable",
      [t("chart.compare.metric"), t("chart.compare.valueA", { year: Fmt.year(a.year_ce) }),
      t("chart.compare.valueB", { year: Fmt.year(b.year_ce) }), t("chart.compare.change"), t("chart.compare.pctChange")],
      rows.map(function (r) {
        if (r.a == null || r.b == null) return [t(r.k), r.a == null ? null : Fmt.num(r.a), r.b == null ? null : Fmt.num(r.b), null, null];
        var f = r.plain ? function (v) { return Fmt.num(v, 1); } : Fmt.num;
        return [t(r.k), f(r.a), f(r.b), Fmt.signed(r.b - r.a, r.plain ? 1 : 0),
        r.a ? Fmt.signedPct((r.b - r.a) / r.a * 100) : null];
      }));

    $("compareSummary").textContent = t("chart.compare.summary", {
      a: Fmt.year(a.year_ce), b: Fmt.year(b.year_ce),
      popChange: Fmt.signed(b.total - a.total), popPct: Fmt.signedPct((b.total - a.total) / a.total * 100),
      childChange: (a.children != null && b.children != null) ? Fmt.signed(b.children - a.children) : t("state.unavailable"),
      workChange: (a.working != null && b.working != null) ? Fmt.signed(b.working - a.working) : t("state.unavailable"),
      olderChange: (a.older != null && b.older != null) ? Fmt.signed(b.older - a.older) : t("state.unavailable"),
      depA: a.dependency_ratio != null ? Fmt.num(a.dependency_ratio, 1) : "—",
      depB: b.dependency_ratio != null ? Fmt.num(b.dependency_ratio, 1) : "—"
    });
    $("compareWarn").innerHTML = a.data_type !== b.data_type
      ? '<div class="warn-note">' + t("chart.compare.mixedTypes", { typeA: typeLabel(a.data_type), typeB: typeLabel(b.data_type) }) + "</div>"
      : "";
    sourceNote("compareSource", "dopa_pop_year", Fmt.year(a.year_ce) + " · " + Fmt.year(b.year_ce));
  }

  /* -------------------------------------------------------------- insights */
  function renderInsights() {
    var reg = D.population_by_year;
    var last = reg[reg.length - 1];
    var ageYears = D.meta.age_structure_years;
    var firstAge = byYear(ageYears[0]);
    var p24 = D.pyramid["2024"].groups;
    function grp(a) { var g = p24.filter(function (x) { return x.age === a; })[0]; return g ? g.male + g.female : 0; }
    var veryOld = ["80-84", "85-89", "90-94", "95+"].reduce(function (s, a) { return s + grp(a); }, 0);
    var youngAdults = ["25-29", "30-34", "35-39"].reduce(function (s, a) { return s + grp(a); }, 0);
    var ne = D.regions.filter(function (r) { return r.region_code === "northeast"; })[0];
    var bkkReg = D.regions.filter(function (r) { return r.region_code === "bkk"; })[0];
    var bangkok = D.provinces.filter(function (p) { return p.province_code === "10"; })[0];
    var pyrFirst = D.pyramid[String(D.meta.pyramid_years[0])].groups[0];

    var v = {
      lastYear: Fmt.year(last.year_ce), firstYear: Fmt.year(ageYears[0]), firstAgeYear: Fmt.year(D.meta.pyramid_years[0]),
      workLast: Fmt.big(last.working), workFirst: Fmt.big(firstAge.working),
      growthLast: Fmt.num(last.growth_rate, 2),
      depLast: Fmt.num(last.dependency_ratio, 1),
      olderLast: Fmt.pct(last.older / last.total * 100), olderShare: Fmt.pct(last.older / last.total * 100),
      olderPop: Fmt.big(last.older), veryOld: Fmt.big(veryOld),
      kids0Last: Fmt.num(grp("0-4")), kids0First: Fmt.num(pyrFirst.male + pyrFirst.female),
      preRetire: Fmt.big(grp("55-59")), youngAdults: Fmt.big(youngAdults),
      neShare: Fmt.pct(ne.share), nePop: Fmt.big(ne.total),
      bkkShare: Fmt.pct(bkkReg.share), bkkPop: Fmt.big(bkkReg.total),
      childShare: Fmt.pct(last.children / last.total * 100), workShare: Fmt.pct(last.working / last.total * 100),
      childPop: Fmt.big(last.children),
      bkkPopOnly: Fmt.big(bangkok.total), bkkSexRatio: Fmt.num(bangkok.sex_ratio, 1),
      bkkDensity: Fmt.num(bangkok.density, 1) + " " + t("chart.province.densityUnit"),
      natDensity: "128.5 " + t("chart.province.densityUnit")
    };
    var keys = ["labour", "growth", "dependency", "health", "education", "retirement",
      "housing", "regional", "segments", "older", "younger", "bangkok"];
    $("insights").innerHTML = keys.map(function (k) {
      return '<article class="insight"><h3>' + t("insight." + k + ".title") + "</h3><dl>" +
        "<dt>" + t("insights.observation") + '</dt><dd class="obs">' + t("insight." + k + ".obs", v) + "</dd>" +
        "<dt>" + t("insights.why") + "</dt><dd>" + t("insight." + k + ".why", v) + "</dd>" +
        "<dt>" + t("insights.implication") + "</dt><dd>" + t("insight." + k + ".imp", v) + "</dd>" +
        "</dl></article>";
    }).join("");
  }

        "</dl></div>";

  /* ------------------------------------------------------------------ csv */
  var CSV_FIELDS = ["year_be", "year_ce", "region_code", "region_th", "region_en", "province_code",
    "province_th", "province_en", "sex", "age_group", "population", "births", "deaths",
    "households", "data_type", "source_name", "source_table", "source_url", "last_updated"];

  function buildRows(filtered) {
    var out = [];
    function push(o) {
      var r = {}; CSV_FIELDS.forEach(function (f) { r[f] = o[f] === undefined || o[f] === null ? "" : o[f]; });
      out.push(r);
    }
    var sTot = D.sources.dopa_pop_year, sAge = D.sources.dopa_pop_age,
      sProv = D.sources.dopa_pop_province, sVit = D.sources.moph_vital, sProj = D.sources.nso_projection;

    function wantSex(s) { return !filtered || pick("sex", s); }
    function wantType(x) { return !filtered || typeOn(x); }
    function wantYear(y) { return !filtered || inRange(y); }

    D.population_by_year.forEach(function (d) {
      if (!wantYear(d.year_ce) || !wantType("registered")) return;
      ["total", "male", "female"].forEach(function (sx) {
        if (!wantSex(sx)) return;
        push({
          year_be: d.year_be, year_ce: d.year_ce, region_code: "TH", region_th: "ประเทศไทย",
          region_en: "Whole Kingdom", sex: sx, age_group: "all", population: d[sx],
          births: sx === "total" ? d.births : "", deaths: sx === "total" ? d.deaths : "",
          data_type: "registered", source_name: sTot.org_en, source_table: sTot.table_en,
          source_url: sTot.url, last_updated: sTot.last_updated
        });
      });
    });
    Object.keys(D.pyramid).forEach(function (yk) {
      var y = parseInt(yk, 10), pack = D.pyramid[yk];
      if (!wantYear(y) || !wantType(pack.data_type)) return;
      var src = pack.data_type === "projection" ? sProj : sAge;
      pack.groups.forEach(function (g) {
        if (filtered) {
          var m = ageMatcher();
          if (m && !m(g.age)) return;
        }
        [["male", g.male], ["female", g.female], ["total", g.male + g.female]].forEach(function (p) {
          if (!wantSex(p[0])) return;
          push({
            year_be: y + 543, year_ce: y, region_code: "TH", region_th: "ประเทศไทย",
            region_en: "Whole Kingdom", sex: p[0], age_group: g.age, population: p[1],
            data_type: pack.data_type, source_name: src.org_en, source_table: src.table_en,
            source_url: src.url, last_updated: src.last_updated
          });
        });
      });
    });
    D.provinces.forEach(function (p) {
      if (!wantYear(p.year_ce) || !wantType("registered")) return;
      if (filtered && S.region.length && S.region.indexOf(p.region_code) < 0) return;
      if (filtered && S.province.length && S.province.indexOf(p.province_code) < 0) return;
      var reg = D.regions.filter(function (r) { return r.region_code === p.region_code; })[0];
      ["total", "male", "female"].forEach(function (sx) {
        if (!wantSex(sx)) return;
        push({
          year_be: p.year_be, year_ce: p.year_ce, region_code: p.region_code,
          region_th: reg.region_th, region_en: reg.region_en, province_code: p.province_code,
          province_th: p.province_th, province_en: p.province_en, sex: sx, age_group: "all",
          population: p[sx], data_type: "registered", source_name: sProv.org_en,
          source_table: sProv.table_en, source_url: sProv.url, last_updated: sProv.last_updated
        });
      });
    });
    D.vital.forEach(function (v) {
      if (!wantYear(v.year_ce) || !wantType("registered")) return;
      push({
        year_be: v.year_be, year_ce: v.year_ce, region_code: "TH", region_th: "ประเทศไทย",
        region_en: "Whole Kingdom", sex: "total", age_group: "all", births: v.births, deaths: v.deaths,
        data_type: "registered", source_name: sVit.org_en, source_table: sVit.table_en,
        source_url: sVit.url, last_updated: sVit.last_updated
      });
    });
    return out;
  }

  function downloadCSV(filtered) {
    var rows = buildRows(filtered);
    var lines = [CSV_FIELDS.join(",")];
    rows.forEach(function (r) {
      lines.push(CSV_FIELDS.map(function (f) {
        var v = String(r[f]);
        return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
      }).join(","));
    });
    var blob = new Blob(["﻿" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filtered ? "thailand-demography-filtered.csv" : "thailand-demography-full.csv";
    document.body.appendChild(a); a.click(); a.remove();
  }

  /* --------------------------------------------------------------- filters */
  var MS = {};

  function createFilters() {
    ["region", "province", "sex", "age", "type"].forEach(function (key) {
      MS[key] = MultiSelect($("f" + key.charAt(0).toUpperCase() + key.slice(1)), {
        id: "ms-" + key, labelledBy: "lbl" + key.charAt(0).toUpperCase() + key.slice(1),
        onChange: function (vals) { S[key] = vals; renderAll(); }
      });
    });
  }

  /* A plain-language summary of everything currently narrowing the view. */
  function renderActiveFilters() {
    var chips = [];
    function add(labelKey, values, fmt) {
      if (!values.length) return;
      chips.push('<span class="af"><b>' + t(labelKey) + ":</b> " +
        esc(values.map(fmt).join(", ")) + "</span>");
    }
    add("filters.region", S.region, function (v) {
      var r = D.regions.filter(function (x) { return x.region_code === v; })[0];
      return r ? (LANG === "th" ? r.region_th : r.region_en) : v;
    });
    add("filters.province", S.province, function (v) {
      var p = D.provinces.filter(function (x) { return x.province_code === v; })[0];
      return p ? (LANG === "th" ? p.province_th : p.province_en) : v;
    });
    add("filters.sex", S.sex, function (v) { return t("sex." + v); });
    add("filters.ageGroup", S.age, function (v) {
      return v.indexOf("g:") === 0 ? ageLabel(v.slice(2)) : t("age." + v);
    });
    add("filters.dataType", S.type, function (v) { return t("dataType." + v); });

    $("activeFilters").innerHTML = chips.length
      ? '<span class="af-label">' + t("filters.active") + ":</span> " + chips.join("") +
      ' <button type="button" class="ghost-btn" id="clearAllBtn">' + t("filters.clearAll") + "</button>"
      : "";
    var c = $("clearAllBtn");
    if (c) c.addEventListener("click", function () {
      MULTI_KEYS.forEach(function (k) { S[k] = []; });
      renderAll();
    });
  }

  function opt(value, label, disabled) {
    return '<option value="' + esc(value) + '"' + (disabled ? " disabled" : "") + ">" + esc(label) + "</option>";
  }

  function buildFilters() {
    var years = allYears();
    var yearsSel = yearsForType();
    var pyrYears = D.meta.pyramid_years;

    /* The year pickers live inside the figures they steer, so there can be
       several of each on the page. They all read and write the same state. */
    var yearOpts = years.map(function (y) {
      return opt(y, Fmt.year(y, { both: true }), yearsSel.indexOf(y) < 0);
    }).join("");
    document.querySelectorAll('select[data-filter="year"]').forEach(function (s) {
      s.innerHTML = yearOpts; s.value = S.year;
    });
    document.querySelectorAll('select[data-filter="compare"]').forEach(function (s) {
      s.innerHTML = yearOpts; s.value = S.compare;
    });


    /* ---- the five multi-value filters ---- */
    var msLabels = function (allLabel) {
      return {
        all: allLabel, selectedCount: t("filters.selectedCount"),
        selectAll: t("filters.selectAll"), clear: t("filters.clear"),
        search: t("filters.search"), none: t("filters.noMatch")
      };
    };

    MS.region.update({
      labels: msLabels(t("filters.allRegions")),
      options: D.regions.map(function (r) {
        return { value: r.region_code, label: LANG === "th" ? r.region_th : r.region_en };
      }),
      selected: S.region
    });
    S.region = MS.region.value();

    var provs = D.provinces.filter(function (p) { return !S.region.length || S.region.indexOf(p.region_code) >= 0; });
    MS.province.update({
      labels: msLabels(t("filters.allProvinces")), searchable: true,
      options: provs.slice().sort(function (a, b) {
        return (LANG === "th" ? a.province_th : a.province_en)
          .localeCompare(LANG === "th" ? b.province_th : b.province_en, LANG === "th" ? "th" : "en");
      }).map(function (p) {
        var reg = D.regions.filter(function (r) { return r.region_code === p.region_code; })[0];
        return {
          value: p.province_code, label: LANG === "th" ? p.province_th : p.province_en,
          group: LANG === "th" ? reg.region_th : reg.region_en
        };
      }),
      selected: S.province
    });
    S.province = MS.province.value();

    MS.sex.update({
      labels: msLabels(t("filters.all")),
      options: [
        { value: "total", label: t("sex.total") },
        { value: "male", label: t("sex.male") },
        { value: "female", label: t("sex.female") }
      ],
      selected: S.sex
    });
    S.sex = MS.sex.value();

    /* Age filter: the three broad bands plus every five-year group the source
       publishes, so the detail on screen matches the detail in the table. */
    var ageOk = pyrYears.indexOf(S.year) >= 0;
    MS.age.update({
      labels: msLabels(t("age.all")), searchable: true,
      options: BROAD_KEYS.map(function (k) {
        return { value: k, label: t("age." + k), disabled: !ageOk, group: t("age.broadGroup") };
      }).concat(D.age_order.map(function (a) {
        return { value: "g:" + a, label: ageLabel(a), disabled: !ageOk, group: t("age.fiveYearGroup") };
      })),
      selected: S.age
    });
    S.age = MS.age.value();

    MS.type.update({
      labels: msLabels(t("filters.all")),
      options: [
        { value: "registered", label: t("dataType.registered") },
        { value: "census", label: t("dataType.census") },
        { value: "projection", label: t("dataType.projection") },
        { value: "survey", label: t("dataType.survey"), disabled: true }
      ],
      selected: S.type
    });
    S.type = MS.type.value();

    /* custom age range + segment presets */
    var range = currentAgeRange();
    var topLabel = function (v) { return v === 95 ? t("age.plus") : ageLabel(v + "-" + (v + 4)); };
    $("fAgeFrom").innerHTML = '<option value="">' + esc(t("age.all")) + "</option>" +
      AGE_STARTS.map(function (v) { return opt(v, topLabel(v)); }).join("");
    $("fAgeTo").innerHTML = '<option value="">' + esc(t("age.all")) + "</option>" +
      AGE_STARTS.map(function (v) { return opt(v, topLabel(v)); }).join("");
    $("fAgeFrom").value = range ? range[0] : "";
    $("fAgeTo").value = range ? range[1] : "";

    $("segmentPresets").innerHTML = '<span class="seg-label">' + t("filters.segments") + ":</span> " +
      SEGMENTS.map(function (sg) {
        var on = range && range[0] === sg[1] && range[1] === sg[2];
        return '<button type="button" data-from="' + sg[1] + '" data-to="' + sg[2] + '"' +
          ' aria-pressed="' + (on ? "true" : "false") + '">' + esc(t(sg[0])) + "</button>";
      }).join("");

    renderActiveFilters();

    /* Controls are bound once in bind(); here we only push state into them. */
    document.querySelectorAll("#provTop button").forEach(function (b) {
      b.setAttribute("aria-pressed", b.dataset.top === S.provTop ? "true" : "false");
    });
    $("pyrCompare").checked = S.pyrCompare;
    $("totalBySex").checked = S.bySex;
    $("ageBarBySex").checked = S.ageBarBySex;
    document.querySelectorAll("#structMode button").forEach(function (b) {
      b.setAttribute("aria-pressed", b.dataset.mode === S.structMode ? "true" : "false");
    });
  }

  /* ------------------------------------------------------------ i18n pass */
  function applyStrings() {
    document.documentElement.lang = LANG;
    document.querySelectorAll("[data-i18n]").forEach(function (n) {
      var k = n.getAttribute("data-i18n");
      if (DICT[k] !== undefined) n.textContent = DICT[k];
    });
    document.querySelectorAll("#langSwitch button").forEach(function (b) {
      b.setAttribute("aria-pressed", b.dataset.lang === LANG ? "true" : "false");
    });
    document.querySelectorAll("#eraSwitch button").forEach(function (b) {
      b.setAttribute("aria-pressed", b.dataset.era === S.era ? "true" : "false");
      b.textContent = t(b.dataset.era === "be" ? "era.be" : "era.ce");
    });
    var tb = $("themeBtn");
    tb.textContent = S.theme === "dark" ? "☀" : "☾";
    tb.title = t("theme.toggle") + " · " + t(S.theme === "dark" ? "theme.light" : "theme.dark");
    tb.setAttribute("aria-label", tb.title);
    document.title = t("app.title") + " · " + (LANG === "th" ? "Thailand Demographic Overview" : "ภาพรวมประชากรไทย");
    document.querySelectorAll("[data-table-toggle]").forEach(function (b) {
      var tgt = $(b.dataset.tableToggle);
      b.textContent = t(tgt && tgt.hidden === false ? "actions.hideTable" : "actions.showTable");
    });
  }

  /* ------------------------------------------------------------- rendering */
  function renderAll() {
    Fmt.setLang(LANG); Fmt.setEra(S.era);
    applyStrings();
    buildFilters();
    renderCards();
    renderTakeaways();
    renderComposition();
    renderPyramid();
    renderTotal();
    renderStructure();
    renderVital();
    renderMap();
    renderProvince();
    renderCompare();
    renderInsights();
    renderStatic();
    writeURL();
  }

  /* ---------------------------------------------------------------- events */
  function bind() {
    document.querySelectorAll("#langSwitch button").forEach(function (b) {
      b.addEventListener("click", function () { setLang(b.dataset.lang); });
    });
    document.querySelectorAll("#eraSwitch button").forEach(function (b) {
      b.addEventListener("click", function () { S.era = b.dataset.era; renderAll(); });
    });
    $("themeBtn").addEventListener("click", function () {
      S.theme = S.theme === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", S.theme);
      renderAll();
    });
    function applyAgeRange(from, to) {
      if (from === null || to === null) { S.age = []; }
      else {
        if (from > to) { var tmp = from; from = to; to = tmp; }
        S.age = groupsBetween(from, to);
      }
      renderAll();
    }
    ["fAgeFrom", "fAgeTo"].forEach(function (id) {
      $(id).addEventListener("change", function () {
        var a = $("fAgeFrom").value, b = $("fAgeTo").value;
        if (a === "" && b === "") return applyAgeRange(null, null);
        if (a === "") a = b;
        if (b === "") b = a;
        applyAgeRange(parseInt(a, 10), parseInt(b, 10));
      });
    });
    $("ageRangeClear").addEventListener("click", function () { applyAgeRange(null, null); });
    $("segmentPresets").addEventListener("click", function (e) {
      var b = e.target.closest("button[data-from]");
      if (!b) return;
      if (b.getAttribute("aria-pressed") === "true") return applyAgeRange(null, null);
      applyAgeRange(parseInt(b.dataset.from, 10), parseInt(b.dataset.to, 10));
    });
    document.querySelectorAll("#mapMeasure button").forEach(function (b) {
      b.addEventListener("click", function () { S.mapMeasure = b.dataset.measure; renderAll(); });
    });
    document.querySelectorAll("#provTop button").forEach(function (b) {
      b.addEventListener("click", function () { S.provTop = b.dataset.top; renderAll(); });
    });
    document.querySelectorAll("select[data-filter]").forEach(function (s) {
      s.addEventListener("change", function (e) {
        S[s.dataset.filter === "compare" ? "compare" : "year"] = parseInt(e.target.value, 10);
        renderAll();
      });
    });
    $("ageBarBySex").addEventListener("change", function (e) {
      S.ageBarBySex = e.target.checked; renderComposition(); writeURL();
    });
    $("resetBtn").addEventListener("click", function () { defaults(); renderAll(); });
    $("copyLinkBtn").addEventListener("click", function () {
      var btn = $("copyLinkBtn");
      (navigator.clipboard ? navigator.clipboard.writeText(location.href) : Promise.reject()).then(function () {
        btn.textContent = t("actions.copied");
        setTimeout(function () { btn.textContent = t("actions.copyLink"); }, 1600);
      }).catch(function () { });
    });
    $("csvBtn").addEventListener("click", function () { downloadCSV(true); });
    $("csvAllBtn").addEventListener("click", function () { downloadCSV(false); });
    $("pyrCompare").addEventListener("change", function (e) { S.pyrCompare = e.target.checked; renderPyramid(); writeURL(); });
    $("totalBySex").addEventListener("change", function (e) { S.bySex = e.target.checked; renderTotal(); writeURL(); });
    document.querySelectorAll("#structMode button").forEach(function (b) {
      b.addEventListener("click", function () { S.structMode = b.dataset.mode; renderAll(); });
    });
    document.addEventListener("click", function (e) {
      var b = e.target.closest("[data-table-toggle]");
      if (!b) return;
      var tgt = $(b.dataset.tableToggle);
      tgt.hidden = !tgt.hidden;
      b.textContent = t(tgt.hidden ? "actions.showTable" : "actions.hideTable");
    });
  }

  function setLang(l) {
    LANG = S.lang = l;
    DICT = window.__I18N__[l];
    renderAll();
    if (window.SourcesPage) SourcesPage.setLang(LANG);
  }

  function defaults() {
    var years = allYears();
    S.year = D.meta.latest_registered_year;
    S.compare = D.meta.pyramid_years[0];
    MULTI_KEYS.forEach(function (k) { S[k] = []; });
    S.bySex = false; S.pyrCompare = false; S.ageBarBySex = false; S.structMode = "pct";
    S.provSort = "pop"; S.provTop = "20"; S.mapMeasure = "region";
  }

  /* ------------------------------------------------------------------ boot */
  function fail(msg) {
    document.querySelector("main .wrap").innerHTML =
      '<div class="state error" style="margin:40px 0"><strong>' + msg + "</strong><span>" +
      (DICT["state.errorHint"] || "") + "</span></div>";
  }

  function start(i18n, data, srcIndex) {
    window.__I18N__ = i18n; D = data;
    readURL();
    LANG = S.lang; DICT = i18n[LANG] || i18n.th;
    document.documentElement.setAttribute("data-theme", S.theme);
    /* Only fill in what the URL did not supply — a shared link must not have its
       filters wiped just because it omitted the year. */
    var years = allYears();
    if (!S.year || years.indexOf(S.year) < 0) S.year = D.meta.latest_registered_year;
    if (!S.compare || years.indexOf(S.compare) < 0) S.compare = D.meta.pyramid_years[0];
    createFilters();
    bind();
    renderAll();
    /* The sources directory is a second page inside the same document, so the
       single-file build keeps working when it is shared as one file. */
    if (window.SourcesPage && srcIndex) {
      SourcesPage.init(srcIndex, t, LANG, function (page) {
        if (page === "dash") Object.keys(charts).forEach(function (k) {
          if (charts[k] && charts[k].redraw) charts[k].redraw();
        });
      });
    }
  }

  document.addEventListener("DOMContentLoaded", function () {
    if (window.__EMBEDDED__) {
      start(window.__EMBEDDED__.i18n, window.__EMBEDDED__.data, window.__EMBEDDED__.sources);
      return;
    }
    Promise.all([
      fetch("locales/th.json").then(function (r) { return r.json(); }),
      fetch("locales/en.json").then(function (r) { return r.json(); }),
      fetch("data/thailand_demography.json").then(function (r) { return r.json(); }),
      fetch("data/sources_index.json").then(function (r) { return r.json(); })
    ]).then(function (res) {
      start({ th: res[0], en: res[1] }, res[2], res[3]);
    }).catch(function (err) {
      console.error(err);
      fail("Data could not be loaded / ไม่สามารถโหลดข้อมูลได้");
    });
  });
})();

</script>
</body>
</html>
